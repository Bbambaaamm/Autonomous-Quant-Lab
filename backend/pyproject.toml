[project]
name = "autonomous-quant-lab"
version = "0.1.0"
description = "Auditovatelná quantitative research a paper-trading platforma"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "pyarrow>=20,<24",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
quantlab-worker = "quantlab.worker:main"

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
required-version = "==0.12.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/quantlab/api.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["quantlab"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
