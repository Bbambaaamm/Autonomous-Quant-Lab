sdist = { url = "https://pypi.org/packages/source/a/annotated-types/annotated-types-0.8.0.tar.gz" }

[[package]]
name = "anyio"
version = "4.14.2"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://pypi.org/packages/source/a/anyio/anyio-4.14.2.tar.gz" }
dependencies = [
    { name = "idna" },
    { name = "typing-extensions", marker = "python_full_version < '3.13'" },
]

[[package]]
name = "autonomous-quant-lab"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "alembic" },
    { name = "fastapi" },
    { name = "psycopg", extra = ["binary"] },
    { name = "pyarrow" },
    { name = "pydantic-settings" },
    { name = "sqlalchemy" },
    { name = "uvicorn" },
]

[package.dev-dependencies]
dev = [
    { name = "httpx2" },
    { name = "mypy" },
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "alembic", specifier = ">=1.16,<2" },
    { name = "fastapi", specifier = ">=0.116,<1" },
    { name = "psycopg", extras = ["binary"], specifier = ">=3.2,<4" },
    { name = "pyarrow", specifier = ">=20,<24" },
    { name = "pydantic-settings", specifier = ">=2.10,<3" },
    { name = "sqlalchemy", specifier = ">=2.0,<3" },
    { name = "uvicorn", specifier = ">=0.35,<1" },
]

[package.metadata.requires-dev]
dev = [
    { name = "httpx2", specifier = ">=2,<3" },
    { name = "mypy", specifier = ">=1.17,<2" },
    { name = "pytest", specifier = ">=8.4,<10" },
    { name = "ruff", specifier = ">=0.12,<1" },
]

