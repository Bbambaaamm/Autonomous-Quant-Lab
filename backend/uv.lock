version = 1
revision = 2
requires-python = ">=3.12"
resolution-markers = [
    "python_full_version >= '3.15'",
    "python_full_version < '3.15'",
]

[[package]]
name = "alembic"
version = "1.17.2"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://pypi.org/packages/source/a/alembic/alembic-1.17.2.tar.gz" }
dependencies = [
    { name = "mako" },
    { name = "sqlalchemy" },
    { name = "typing-extensions" },
]

[[package]]
name = "annotated-doc"
version = "0.0.5"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://pypi.org/packages/source/a/annotated-doc/annotated-doc-0.0.5.tar.gz" }

[[package]]
name = "annotated-types"
version = "0.8.0"
