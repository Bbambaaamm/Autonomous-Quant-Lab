services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quantlab
      POSTGRES_USER: quantlab_migration
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [quantlab-production-db:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantlab_migration -d quantlab"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
  backend:
    image: quantlab-backend
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: [.env.production]
    environment:
      AUTOMATION_ENABLED: "true"
    depends_on: {postgres: {condition: service_healthy}}
    networks: [data, application]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  worker:
    image: quantlab-backend
    env_file: [.env.production]
    environment:
      AUTOMATION_ENABLED: "true"
      WORKER_REQUIRE_PRODUCTION: "true"
      WORKER_ID_PREFIX: "${WORKER_ID_PREFIX:-production-worker}"
    command: ["/app/backend/.venv/bin/quantlab-worker"]
    healthcheck: {disable: true}
    depends_on: {postgres: {condition: service_healthy}}
    networks: [data]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    env_file: [.env.production]
    depends_on: [backend]
    networks: [application]
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  data: {internal: true}
  application: {internal: false}
volumes:
  quantlab-production-db:
secrets:
  db_password: {file: .secrets/db_password}
