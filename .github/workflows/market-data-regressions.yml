name: Market data regressions
on: [push, pull_request]
permissions:
  contents: read

jobs:
  market-data-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Verify and install locked dependencies
        run: |
          uv lock --check
          uv sync --locked --all-groups
      - name: Market acquisition, screening and historical-evidence regressions
        run: >-
          uv run pytest -q
          tests/test_market_pipeline.py
          tests/test_market_screening.py
          tests/test_alpaca_corporate_actions.py
