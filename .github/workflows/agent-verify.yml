name: Agent verification gate

on:
  workflow_run:
    workflows: [CI, Agent review signal]
    types: [completed]
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Ověř automatizované handoff podmínky
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pipeline = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/agent-pipeline.cjs`);
            const config = require(`${process.env.GITHUB_WORKSPACE}/.github/agent-pipeline.json`);
            const triggerRun = context.payload.workflow_run;
            const trigger = pipeline.verificationTriggerDecision({
              workflowRun: triggerRun,
              workflowCallInputs: {
                prNumber: "${{ inputs.pr_number || '' }}",
                headSha: "${{ inputs.head_sha || '' }}",
              },
            });
            if (!trigger.ok) { core.notice(`NO_WRITE: ${trigger.reason}`); return; }
            let run = trigger.kind === "ci" ? triggerRun : null;
            let jobs = null;
            const prNumber = trigger.prNumber;
            if (run) {
              jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo, run_id: run.id, filter: "all", per_page: 100,
              });
            } else {
              let requestedSha = trigger.headSha;
              if (trigger.kind === "review-signal") {
                const { data: triggeredPull } = await github.rest.pulls.get({
                  ...context.repo, pull_number: prNumber,
                });
                requestedSha = triggeredPull.head.sha;
              }
              const listed = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                ...context.repo, event: "pull_request", head_sha: requestedSha, status: "completed", per_page: 100,
              });
              const candidates = pipeline.authoritativeCiRunCandidates(listed, {
                workflowName: "CI", headSha: requestedSha, prNumber,
              });
              for (const candidate of candidates) {
                const candidateJobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  ...context.repo, run_id: candidate.id, filter: "all", per_page: 100,
                });
                if (pipeline.successfulRequiredJobs(candidateJobs, config.requiredCiJobs, requestedSha)) {
                  run = candidate;
                  jobs = candidateJobs;
                  break;
                }
              }
              if (!run) { core.notice("NO_WRITE: pro exact head SHA neexistuje kompletní green CI evidence."); return; }
            }
            const { data: pull } = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber });
            const issueNumber = pipeline.parseAgentIssue(pull.body);
            if (issueNumber === null) { core.notice("NO_WRITE: chybí jednoznačný Agent-Issue marker."); return; }
            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: issueNumber });
            if (issue.pull_request) { core.notice("NO_WRITE: marker necílí na Issue."); return; }

            const loadReviewEvidence = async () => {
              const reviewQuery = await github.graphql(`query($owner:String!, $repo:String!, $number:Int!) {
                repository(owner:$owner, name:$repo) { pullRequest(number:$number) { reviewDecision } }
              }`, { owner: context.repo.owner, repo: context.repo.repo, number: prNumber });
              const acknowledgements = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: prNumber, per_page: 100,
              });
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                ...context.repo, pull_number: prNumber, per_page: 100,
              });
              return { reviewDecision: reviewQuery.repository.pullRequest.reviewDecision, reviews, acknowledgements };
            };
            const review = await loadReviewEvidence();
            if (!pipeline.hasDurableLink(review.acknowledgements, {
              ...context.repo, issueNumber, prNumber,
            })) { core.notice("NO_WRITE: chybí durable linkage evidence."); return; }
            const issuePlan = pipeline.stateMutationPlan(issue.labels, "agent:pr", "agent:verified");
            const prPlan = pipeline.stateMutationPlan(pull.labels, "agent:pr", "agent:verified");
            const needsHuman = [...issue.labels, ...pull.labels].some((label) => label.name === "agent:needs-human");
            const decision = pipeline.verificationDecision({
              workflowName: run.name,
              workflowConclusion: run.conclusion,
              headSha: run.head_sha,
              prHeadSha: pull.head.sha,
              open: pull.state === "open",
              correctBase: pull.base.ref === context.payload.repository.default_branch,
              draft: pull.draft,
              reviewSatisfied: pipeline.reviewSatisfied({ ...review, headSha: run.head_sha }),
              independentReviewSatisfied: pipeline.independentReviewSatisfied(review.acknowledgements, run.head_sha),
              issueIsImplementation: pipeline.isImplementation(issue.labels),
              statesReconciliable: issuePlan.ok && prPlan.ok,
              needsHuman,
              requiredJobsSuccessful: pipeline.successfulRequiredJobs(jobs, config.requiredCiJobs, run.head_sha),
            });
            if (!decision.ok) { core.notice(`NO_WRITE: ${decision.reason}`); return; }

            // Bezprostředně před prvním zápisem znovu ověřujeme veškerá měnitelná metadata.
            const { data: freshPull } = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber });
            const freshIssueNumber = pipeline.parseAgentIssue(freshPull.body);
            if (freshIssueNumber !== issueNumber) { core.notice("NO_WRITE: linkage se během ověření změnil."); return; }
            const { data: freshIssue } = await github.rest.issues.get({ ...context.repo, issue_number: issueNumber });
            const freshReview = await loadReviewEvidence();
            if (!pipeline.hasDurableLink(freshReview.acknowledgements, {
              ...context.repo, issueNumber, prNumber,
            })) { core.notice("NO_WRITE: durable linkage evidence se změnila."); return; }
            const freshIssuePlan = pipeline.stateMutationPlan(freshIssue.labels, "agent:pr", "agent:verified");
            const freshPrPlan = pipeline.stateMutationPlan(freshPull.labels, "agent:pr", "agent:verified");
            const freshNeedsHuman = [...freshIssue.labels, ...freshPull.labels]
              .some((label) => label.name === "agent:needs-human");
            const freshDecision = pipeline.verificationDecision({
              workflowName: run.name,
              workflowConclusion: run.conclusion,
              headSha: run.head_sha,
              prHeadSha: freshPull.head.sha,
              open: freshPull.state === "open",
              correctBase: freshPull.base.ref === context.payload.repository.default_branch,
              draft: freshPull.draft,
              reviewSatisfied: pipeline.reviewSatisfied({ ...freshReview, headSha: run.head_sha }),
              independentReviewSatisfied: pipeline.independentReviewSatisfied(freshReview.acknowledgements, run.head_sha),
              issueIsImplementation: !freshIssue.pull_request && pipeline.isImplementation(freshIssue.labels),
              statesReconciliable: freshIssuePlan.ok && freshPrPlan.ok,
              needsHuman: freshNeedsHuman,
              requiredJobsSuccessful: pipeline.successfulRequiredJobs(jobs, config.requiredCiJobs, run.head_sha),
            });
            if (!freshDecision.ok) { core.notice(`NO_WRITE: fresh evidence: ${freshDecision.reason}`); return; }

            const mutateState = async (number, plan) => {
              if (plan.add.length) await github.rest.issues.addLabels({ ...context.repo, issue_number: number, labels: plan.add });
              for (const label of plan.remove) {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number: number, name: label });
              }
            };
            await mutateState(prNumber, freshPrPlan);
            // Druhá kompletní fresh kontrola chrání i write na Issue po prvním párovém zápisu.
            const { data: writeFreshPull } = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber });
            const { data: writeFreshIssue } = await github.rest.issues.get({ ...context.repo, issue_number: issueNumber });
            const writeFreshReview = await loadReviewEvidence();
            const writePrPlan = pipeline.stateMutationPlan(writeFreshPull.labels, "agent:pr", "agent:verified");
            const writeIssuePlan = pipeline.stateMutationPlan(writeFreshIssue.labels, "agent:pr", "agent:verified");
            const writeNeedsHuman = [...writeFreshIssue.labels, ...writeFreshPull.labels]
              .some((label) => label.name === "agent:needs-human");
            if (!writeIssuePlan.ok || !writePrPlan.ok || !pipeline.isImplementation(writeFreshIssue.labels) ||
                writeFreshPull.head.sha !== run.head_sha || writeFreshPull.state !== "open" || writeFreshPull.draft ||
                writeFreshPull.base.ref !== context.payload.repository.default_branch ||
                pipeline.parseAgentIssue(writeFreshPull.body) !== issueNumber || writeNeedsHuman ||
                !pipeline.hasDurableLink(writeFreshReview.acknowledgements, { ...context.repo, issueNumber, prNumber }) ||
                !pipeline.reviewSatisfied({ ...writeFreshReview, headSha: run.head_sha }) ||
                !pipeline.independentReviewSatisfied(writeFreshReview.acknowledgements, run.head_sha)) {
              return core.setFailed("ISSUE_CHANGED_DURING_WRITE: PR může být v bezpečném partial stavu; opakovaný CI run provede reconciliation");
            }
            await mutateState(issueNumber, writeIssuePlan);
            const evidence = `Automatizované handoff podmínky splněny pro head SHA \`${run.head_sha}\`.\n\nCI run: ${run.html_url}\n\nTento stav **není merge authorization**. Merge smí provést pouze člověk přes branch protection.`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: prNumber, body: evidence });
            await github.rest.issues.createComment({ ...context.repo, issue_number: issueNumber, body: `PR #${prNumber}: ${evidence}` });
