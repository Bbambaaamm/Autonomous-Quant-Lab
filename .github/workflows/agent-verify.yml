name: Agent verification gate

on:
  workflow_run:
    workflows: [CI, Agent review signal]
    types: [completed]
  workflow_call:
    inputs:
      pr_number: {required: true, type: number}
      head_sha: {required: true, type: string}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
      pr_number: ${{ steps.verify.outputs.pr_number }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
      spec_hash: ${{ steps.verify.outputs.spec_hash }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: '${{ github.event.repository.default_branch }}', persist-credentials: false, fetch-depth: 1}
      - id: verify
        name: Verify authorization, current-main, exact CI and independent review
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const p=require('./.github/scripts/agent-pipeline.cjs'),a=require('./.github/scripts/agent-autonomy.cjs'),c=require('./.github/agent-pipeline.json');
            const trigger=p.verificationTriggerDecision({workflowRun:context.payload.workflow_run,workflowCallInputs:{prNumber:'${{ inputs.pr_number || '' }}',headSha:'${{ inputs.head_sha || '' }}'}});
            if(!trigger.ok){core.notice(`NO_WRITE:${trigger.reason}`);return;}
            const prNumber=trigger.prNumber,repo=`${context.repo.owner}/${context.repo.repo}`;
            let requestedSha=trigger.headSha;
            if(trigger.kind==='review-signal'){
              const {data:triggeredPull}=await github.rest.pulls.get({...context.repo,pull_number:prNumber});
              requestedSha=triggeredPull.head.sha;
            }
            if(!/^[0-9a-f]{40}$/.test(requestedSha||'')) return core.notice('NO_WRITE: invalid exact SHA');

            const load=async()=>{
              const {data:pr}=await github.rest.pulls.get({...context.repo,pull_number:prNumber});
              const issueNumber=p.parseAgentIssue(pr.body);
              if(!issueNumber) return {ok:false,reason:'LINKAGE_INVALID',pr};
              const {data:issue}=await github.rest.issues.get({...context.repo,issue_number:issueNumber});
              const prComments=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:prNumber,per_page:100});
              const issueComments=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:issueNumber,per_page:100});
              const auth=a.authorizationDecision({comments:issueComments,repo,issueNumber,title:issue.title,body:issue.body||'',labels:issue.labels});
              const linkage=p.fullLinkageDecision({prBody:pr.body,prComments,issueComments,...context.repo,issueNumber,prNumber});
              const {data:main}=await github.rest.repos.getBranch({...context.repo,branch:context.payload.repository.default_branch});
              const comparison=pr.head.sha===requestedSha ? await github.rest.repos.compareCommits({...context.repo,base:main.commit.sha,head:requestedSha}) : null;
              return {ok:true,pr,issue,issueNumber,prComments,issueComments,auth,linkage,main,comparison};
            };
            const setNeedsHuman=async(state,reason)=>{
              for(const [number,item] of [[prNumber,state.pr],[state.issueNumber,state.issue]]){
                const names=a.labelNames(item.labels),preserved=names.filter(label=>!label.startsWith('agent:'));
                await github.rest.issues.setLabels({...context.repo,issue_number:number,labels:[...preserved,'agent:needs-human']});
              }
              await github.rest.issues.createComment({...context.repo,issue_number:prNumber,body:`Automatic verification stopped fail-closed: ${reason}.`});
            };
            let state=await load();
            if(!state.ok){core.notice(`NO_WRITE:${state.reason}`);return;}
            if(state.pr.head.sha!==requestedSha){core.notice('NO_WRITE: exact head already changed');return;}
            if(!state.auth.ok){
              if(['AUTHORIZATION_STALE','AUTHORIZATION_MISSING','AUTHORIZATION_AMBIGUOUS'].includes(state.auth.reason)&&state.linkage.ok){await setNeedsHuman(state,state.auth.reason);}
              return core.notice(`NO_WRITE:${state.auth.reason}`);
            }
            const lifecycle=a.verificationLifecyclePlan(state.pr.labels,state.issue.labels);
            if(!p.isImplementation(state.issue.labels)||!state.linkage.ok||!lifecycle.ok||state.pr.state!=='open'||state.pr.base.ref!==context.payload.repository.default_branch||state.pr.draft){
              core.notice(`NO_WRITE:${lifecycle.reason||state.linkage.reason||'PR_STATE'}`);return;
            }
            if(state.comparison.data.behind_by>0){
              try {
                await github.rest.pulls.updateBranch({...context.repo,pull_number:prNumber,expected_head_sha:requestedSha});
                core.notice('AUTO_RECONCILED: new head requires fresh CI and Codex review');
                return;
              } catch(error) {
                if(error.status===409||error.status===422){await setNeedsHuman(state,'RECONCILIATION_CONFLICT');return;}
                throw error;
              }
            }

            let run=trigger.kind==='ci' ? context.payload.workflow_run : null,jobs=null;
            if(run){
              jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:run.id,filter:'all',per_page:100});
            } else {
              const runs=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{...context.repo,event:'pull_request',head_sha:requestedSha,status:'completed',per_page:100});
              const candidates=p.authoritativeCiRunCandidates(runs,{workflowName:'CI',headSha:requestedSha,prNumber});
              for(const candidate of candidates){
                const candidateJobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:candidate.id,filter:'all',per_page:100});
                if(p.successfulRequiredJobs(candidateJobs,c.requiredCiJobs,requestedSha)){run=candidate;jobs=candidateJobs;break;}
              }
            }
            if(!run||!p.authoritativeCiIdentity(run,{prNumber,headSha:requestedSha,conclusion:'success'})||!p.successfulRequiredJobs(jobs,c.requiredCiJobs,requestedSha)){
              core.notice('NO_WRITE: exact authoritative green CI missing');return;
            }
            const initial=a.verificationDecision({
              authorizationCurrent:state.auth.ok,
              issueIsImplementation:p.isImplementation(state.issue.labels),
              linkageValid:state.linkage.ok,
              open:state.pr.state==='open',correctBase:state.pr.base.ref===context.payload.repository.default_branch,draft:state.pr.draft,
              exactHead:state.pr.head.sha===requestedSha,lifecycleValid:lifecycle.ok,
              needsHuman:[...a.labelNames(state.pr.labels),...a.labelNames(state.issue.labels)].includes('agent:needs-human'),
              currentMain:state.comparison.data.behind_by===0,
              requiredCiSuccessful:p.successfulRequiredJobs(jobs,c.requiredCiJobs,requestedSha),
              independentReviewPass:p.independentReviewSatisfied(state.prComments,requestedSha),
            });
            if(!initial.ok){core.notice(`NO_WRITE:${initial.reason}`);return;}

            state=await load();
            const freshLifecycle=a.verificationLifecyclePlan(state.pr.labels,state.issue.labels);
            if(!state.ok||state.pr.head.sha!==requestedSha||!state.auth.ok||!state.linkage.ok||!freshLifecycle.ok||state.comparison.data.behind_by!==0||!p.independentReviewSatisfied(state.prComments,requestedSha)||!p.successfulRequiredJobs(jobs,c.requiredCiJobs,requestedSha)) return core.setFailed('VERIFICATION_TOCTOU_REJECTED');
            const setVerified=async(number,item)=>{
              const names=a.labelNames(item.labels),preserved=names.filter(label=>!label.startsWith('agent:'));
              await github.rest.issues.setLabels({...context.repo,issue_number:number,labels:[...preserved,'agent:verified']});
            };
            if(!a.exactAgentState(state.pr.labels,'agent:verified')) await setVerified(prNumber,state.pr);
            state=await load();
            if(state.pr.head.sha!==requestedSha||!state.auth.ok||!state.linkage.ok||state.comparison.data.behind_by!==0||!p.independentReviewSatisfied(state.prComments,requestedSha)) return core.setFailed('ISSUE_WRITE_TOCTOU_REJECTED');
            if(!a.exactAgentState(state.issue.labels,'agent:verified')) await setVerified(state.issueNumber,state.issue);
            state=await load();
            if(!a.lifecyclePairDecision(state.pr.labels,state.issue.labels,'agent:verified').ok||state.pr.head.sha!==requestedSha||!state.auth.ok||state.comparison.data.behind_by!==0) return core.setFailed('VERIFIED_POSTCONDITION_FAILED');
            if(!a.exactVerificationEvidence(state.prComments,{repo,issueNumber:state.issueNumber,prNumber,headSha:requestedSha,specHash:state.auth.specHash})){
              const marker=a.verificationMarker({repo,issueNumber:state.issueNumber,prNumber,headSha:requestedSha,specHash:state.auth.specHash,ciRunId:run.id});
              await github.rest.issues.createComment({...context.repo,issue_number:prNumber,body:`Automated exact-SHA verification PASS for \`${requestedSha}\`.\n\nCI run: ${run.html_url}\nIndependent Codex Reviewer: PASS\nAuthorization spec: \`${state.auth.specHash}\`\n\n${marker}`});
            }
            core.setOutput('verified','true');core.setOutput('pr_number',String(prNumber));core.setOutput('head_sha',requestedSha);core.setOutput('spec_hash',state.auth.specHash);

  gate:
    needs: verify
    if: needs.verify.outputs.verified == 'true'
    uses: ./.github/workflows/agent-verified-gate.yml
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    with:
      pr_number: ${{ fromJSON(needs.verify.outputs.pr_number) }}
      head_sha: ${{ needs.verify.outputs.head_sha }}
      spec_hash: ${{ needs.verify.outputs.spec_hash }}
