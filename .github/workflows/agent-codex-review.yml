    needs: [prepare, independent-review]
    runs-on: ubuntu-latest
    permissions: {actions: read, contents: read, issues: write, pull-requests: write}
    outputs:
      pass: ${{ steps.record.outputs.pass }}
      blocked: ${{ steps.record.outputs.blocked }}
      block_reason: ${{ steps.record.outputs.block_reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: '${{ needs.prepare.outputs.source_sha }}', persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
