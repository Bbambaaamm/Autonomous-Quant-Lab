name: Agent Codex review

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: agent-review-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  independent-review:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    permissions: {contents: read, issues: read, pull-requests: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: '${{ github.event.workflow_run.head_sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Ověř exact head bez spuštění repository kódu
        run: test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
        env: {HEAD_SHA: '${{ github.event.workflow_run.head_sha }}'}
      - name: Nezávislý Codex review
        uses: openai/codex-action@3a4b7e67d3f7fd20d203b6daddb9e3d91a2df1d7 # immutable pin
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: read-only
          output-file: ${{ runner.temp }}/review.json
          prompt: >-
            Nezávisle proveď review Issue #${{ github.event.workflow_run.pull_requests[0].number }} scope,
            AGENTS.md a base-to-exact-head diffu ${{ github.event.workflow_run.head_sha }}. Kontroluj oslabení
            testů, security, paper-only a live-trading invarianty. Nespouštěj repository kód. Vrať striktní JSON
            {"result":"PASS|BLOCK","summary":"..."}; při nejistotě BLOCK.
      - name: Validuj strukturovaný výsledek
        run: |
          test -s "$RUNNER_TEMP/review.json"
          jq -e '(.result=="PASS" or .result=="BLOCK") and (.summary|type=="string")' "$RUNNER_TEMP/review.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: 'codex-review-${{ github.event.workflow_run.head_sha }}', path: '${{ runner.temp }}/review.json', if-no-files-found: error, retention-days: 7}

  trusted-record:
    needs: independent-review
    runs-on: ubuntu-latest
    permissions: {contents: read, issues: write, pull-requests: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: '${{ github.event.repository.default_branch }}', persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: 'codex-review-${{ github.event.workflow_run.head_sha }}', path: '${{ runner.temp }}'}
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env: {PR: '${{ github.event.workflow_run.pull_requests[0].number }}', SHA: '${{ github.event.workflow_run.head_sha }}'}
        with:
          script: |
            const fs=require('fs'), p=require('./.github/scripts/agent-pipeline.cjs');
            const result=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/review.json`));
            const {data:pr}=await github.rest.pulls.get({...context.repo,pull_number:Number(process.env.PR)});
            const issueNumber=p.parseAgentIssue(pr.body);
            if (!issueNumber || pr.head.sha!==process.env.SHA || pr.state!=="open" || pr.base.ref!==context.payload.repository.default_branch) return core.setFailed("TOCTOU_REJECTED");
            const {data:issue}=await github.rest.issues.get({...context.repo,issue_number:issueNumber});
            const comments=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:Number(process.env.PR),per_page:100});
            if (!p.isImplementation(issue.labels)||!p.hasDurableLink(comments,{...context.repo,issueNumber,prNumber:Number(process.env.PR)})) return core.setFailed("LINKAGE_OR_STATE_REJECTED");
            if (p.parseTrustedMarker(comments,"agent-codex-review",process.env.SHA)) return core.notice("Idempotentní NO_WRITE");
            await github.rest.issues.createComment({...context.repo,issue_number:Number(process.env.PR),body:`Independent Codex review: **${result.result}** pro \`${process.env.SHA}\`.\n\n${result.summary}\n\n<!-- agent-codex-review:v2 sha=${process.env.SHA} result=${result.result} -->`});
            if(result.result!=="PASS") core.setFailed("REVIEW_BLOCK");
