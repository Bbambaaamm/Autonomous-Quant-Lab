            const {data:freshRun}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:ciRun.id});
            const freshJobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:ciRun.id,filter:'all',per_page:100});
            const finalRuns=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{...context.repo,event:'pull_request',head_sha:process.env.SHA,per_page:100});
            const finalCi=finalRuns.filter(run=>run.name==='CI'&&run.event==='pull_request'&&run.head_sha===process.env.SHA&&run.pull_requests?.length===1&&run.pull_requests[0].number===prNumber).sort((x,y)=>y.id-x.id)[0];
            // These are the final reads before the sole write boundary.
