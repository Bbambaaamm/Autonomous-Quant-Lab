            if(!writeCi||writeCi.id!==freshRun.id||writeCi.run_attempt!==freshRun.run_attempt||writeCi.status!=='completed'||writeCi.conclusion!=='success')return core.setFailed('NO_WRITE: newest CI changed at review record boundary');
