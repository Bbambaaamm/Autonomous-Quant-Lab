            const fs=require('fs'),crypto=require('crypto'),p=require('./.github/scripts/agent-pipeline.cjs'),a=require('./.github/scripts/agent-autonomy.cjs'),c=require('./.github/agent-pipeline.json'),result=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/review.json`)),seal=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/sealed/seal.json`)),evidence=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/sealed/ci-evidence.json`)),hash=f=>crypto.createHash('sha256').update(fs.readFileSync(`${process.env.RUNNER_TEMP}/sealed/${f}`)).digest('hex');
            const prNumber=Number(process.env.PR),issueNumber=Number(process.env.ISSUE),repo=`${context.repo.owner}/${context.repo.repo}`;
            const sealedBindings={repository:repo,issueNumber,prNumber,headSha:process.env.SHA,baseSha:process.env.BASE,sourceSha:process.env.SOURCE,specHash:process.env.SPEC,ciRunId:Number(process.env.CI_RUN),ciRunAttempt:Number(process.env.CI_ATTEMPT)};
