name: PR67 direct remediation

on:
  push:
    branches:
      - fix/pre-pilot-review-remediation

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pre-pilot-review-remediation
          fetch-depth: 0

      - name: Apply deterministic remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          # automation.py — complete monitoring validation, legacy schedule reconciliation,
          # atomic audited managed retry, and fail-closed causal execution until a true
          # immutable pre-open economic intent exists.
          path = "backend/src/quantlab/automation.py"
          replace_once(
              path,
              'MONITOR_INTERVAL_SECONDS = 3600\n\nTERMINAL =',
              'MONITOR_INTERVAL_SECONDS = 3600\nPREOPEN_EXECUTION_INTENT_BLOCK = "PREOPEN_EXECUTION_INTENT_NOT_PERSISTED"\n\nTERMINAL =',
          )

          marker = '    def create_deployment_job(self, *, deployment_id: str, **schedule: Any) -> ScheduledJob:\n'
          p = Path(path)
          text = p.read_text()
          if text.count(marker) != 1:
              raise SystemExit("automation.py: create_deployment_job marker mismatch")
          helpers = '''    def reconcile_managed_schedules(self, now: datetime | None = None) -> int:\n        """Před pollingem fail-closed vypne legacy/drifted autonomous schedule."""\n        current = utc(now or datetime.now(UTC))\n        disabled = 0\n        with Session(self.engine) as session, session.begin():\n            rows = tuple(\n                session.scalars(\n                    select(ScheduledJob)\n                    .where(\n                        ScheduledJob.job_type == JobType.PREPARE_PAPER_SESSION,\n                        ScheduledJob.enabled.is_(True),\n                    )\n                    .with_for_update()\n                )\n            )\n            for row in rows:\n                canonical = (\n                    row.schedule_type == ScheduleType.DAILY\n                    and row.interval_seconds is None\n                    and row.daily_time == AUTONOMOUS_DAILY_TIME\n                    and row.timezone == AUTONOMOUS_TIMEZONE\n                    and row.misfire_policy == MisfirePolicy.SKIP_IF_TOO_OLD\n                    and row.misfire_grace_seconds == 1\n                    and row.max_attempts == 1\n                )\n                if canonical:\n                    continue\n                row.enabled = False\n                row.updated_at = current\n                disabled += 1\n        return disabled\n\n    def retry_managed_run(\n        self,\n        run_id: str,\n        *,\n        actor: dict[str, str],\n        reason: str,\n        correlation_id: str,\n        now: datetime | None = None,\n    ) -> JobRun:\n        """Atomicky persistuje managed retry transition i control audit evidence."""\n        if not reason.strip():\n            raise ValueError("Retry vyžaduje auditní důvod")\n        current = utc(now or datetime.now(UTC))\n        from quantlab.phase4 import AuditEventRecord\n\n        event_type = "CONTROL_AUTOMATION_RUN_RETRY"\n        entity_type = "job_run"\n        identity = hashlib.sha256(\n            json.dumps(\n                [event_type, entity_type, run_id, actor["actor_id"], reason, correlation_id],\n                sort_keys=True,\n            ).encode()\n        ).hexdigest()\n        with Session(self.engine) as session, session.begin():\n            run = session.scalar(select(JobRun).where(JobRun.id == run_id).with_for_update())\n            if run is None:\n                raise KeyError(run_id)\n            job = session.get(ScheduledJob, run.scheduled_job_id)\n            if job is None or JobType(job.job_type) not in MANAGED_JOB_TYPES:\n                raise ValueError("Operator retry je určen pouze pro managed PAPER jobs")\n            if run.status == RunStatus.SUCCEEDED:\n                raise ValueError("Úspěšný run nelze opakovat")\n            if run.status not in {RunStatus.FAILED, RunStatus.DEAD_LETTER}:\n                raise ValueError("Run není v retry stavu")\n            run.status = RunStatus.RETRY_SCHEDULED\n            run.next_attempt_at = current\n            run.finished_at = None\n            if session.get(AuditEventRecord, identity) is None:\n                session.add(\n                    AuditEventRecord(\n                        id=identity,\n                        timestamp=current,\n                        event_type=event_type,\n                        entity_type=entity_type,\n                        entity_id=run_id,\n                        trading_cycle_id=None,\n                        correlation_id=correlation_id,\n                        payload_json=json.dumps(\n                            {"actor": actor, "reason": reason}, sort_keys=True\n                        ),\n                    )\n                )\n            session.flush()\n            session.refresh(run)\n            session.expunge(run)\n            return run\n\n'''
          p.write_text(text.replace(marker, helpers + marker, 1))

          replace_once(
              path,
              '''                    or monitoring_job.schedule_type != ScheduleType.INTERVAL\n                    or monitoring_job.interval_seconds != MONITOR_INTERVAL_SECONDS\n                ):''',
              '''                    or monitoring_job.schedule_type != ScheduleType.INTERVAL\n                    or monitoring_job.interval_seconds != MONITOR_INTERVAL_SECONDS\n                    or monitoring_job.daily_time is not None\n                    or monitoring_job.timezone != "UTC"\n                    or monitoring_job.misfire_policy != MisfirePolicy.RUN_ONCE_IF_MISSED\n                    or monitoring_job.misfire_grace_seconds != MONITOR_INTERVAL_SECONDS\n                    or monitoring_job.max_attempts != 5\n                    or utc(monitoring_job.next_run_at)\n                    > now + timedelta(seconds=MONITOR_INTERVAL_SECONDS)\n                ):''',
          )

          replace_once(
              path,
              '''        if not rows or len(rows) != len(instrument_ids):\n            raise PermanentJobError("PIT universe scope je prázdný nebo nekonzistentní")\n        provider = self.provider_factory() if self.provider_factory else StooqProvider()''',
              '''        if not rows or len(rows) != len(instrument_ids):\n            raise PermanentJobError("PIT universe scope je prázdný nebo nekonzistentní")\n        # Současný runtime nepersistuje před 09:30 plně specifikovaný immutable order\n        # intent (side + quantity). Po open proto nesmí číst opening print a teprve\n        # následně z něj odvozovat ekonomický příkaz. Do zavedení pre-open intentu\n        # je autonomous economic path záměrně fail-closed.\n        if now >= execution_open:\n            return {\n                "deployment_id": deployment_id,\n                "monitoring_id": monitoring.monitoring_id,\n                "trading_cycle_id": None,\n                "reconciliation_id": None,\n                "outcome": "NO_ACTION",\n                "no_action_reason": PREOPEN_EXECUTION_INTENT_BLOCK,\n            }\n        provider = self.provider_factory() if self.provider_factory else StooqProvider()''',
          )

          p = Path(path)
          text = p.read_text()
          start = text.index('        if run.occurrence_key.startswith("xnys:"):\n', text.index('    def _run_paper_deployment('))
          end = text.index('        def sessions() -> Session:\n', start)
          replacement = '''        if run.occurrence_key.startswith("xnys:"):\n            # Legacy/materialized XNYS occurrence nesmí po upgradu obejít chybějící\n            # immutable pre-open order intent. Žádný raw-open economic effect.\n            return {\n                "deployment_id": deployment_id,\n                "monitoring_id": None,\n                "trading_cycle_id": None,\n                "reconciliation_id": None,\n                "outcome": "NO_ACTION",\n                "no_action_reason": PREOPEN_EXECUTION_INTENT_BLOCK,\n            }\n\n'''
          p.write_text(text[:start] + replacement + text[end:])

          # api.py — operator retry now calls the single-transaction repository operation.
          path = "backend/src/quantlab/api.py"
          replace_once(
              path,
              '    MANAGED_JOB_TYPES,\n    MisfirePolicy,',
              '    MANAGED_JOB_TYPES,\n    MisfirePolicy,\n    RunStatus,',
          )
          old = '''@app.post("/operator/automation/runs/{run_id}/retry")\ndef operator_retry_automation_run(\n    run_id: str, body: ReasonedMutation, request: Request\n) -> dict[str, object]:\n    with Session(automation_repository.engine) as session:\n        run = session.get(JobRun, run_id)\n        if run is None:\n            raise HTTPException(status_code=404, detail="Run nebyl nalezen")\n        job = session.get(ScheduledJob, run.scheduled_job_id)\n        if job is None or JobType(job.job_type) not in MANAGED_JOB_TYPES:\n            raise HTTPException(\n                status_code=409,\n                detail="Operator retry je určen pouze pro managed PAPER jobs",\n            )\n    correlation_id = _correlation(request)\n    try:\n        automation_worker.retry(run_id)\n    except KeyError as exc:\n        raise HTTPException(status_code=404, detail="Run nebyl nalezen") from exc\n    except ValueError as exc:\n        raise HTTPException(status_code=409, detail=str(exc)) from exc\n    _audit_control_mutation(\n        "CONTROL_AUTOMATION_RUN_RETRY",\n        "job_run",\n        run_id,\n        _actor(request),\n        body.reason,\n        correlation_id,\n    )\n    with Session(automation_repository.engine) as session:\n        refreshed = session.get(JobRun, run_id)\n        if refreshed is None:\n            raise HTTPException(status_code=404, detail="Run nebyl nalezen")\n        return _row(refreshed)\n'''
          new = '''@app.post("/operator/automation/runs/{run_id}/retry")\ndef operator_retry_automation_run(\n    run_id: str, body: ReasonedMutation, request: Request\n) -> dict[str, object]:\n    if not settings.automation_enabled:\n        raise HTTPException(status_code=503, detail="Automation je globálně vypnutá")\n    try:\n        row = automation_repository.retry_managed_run(\n            run_id,\n            actor=_actor(request),\n            reason=body.reason,\n            correlation_id=_correlation(request),\n        )\n        return _row(row)\n    except KeyError as exc:\n        raise HTTPException(status_code=404, detail="Run nebyl nalezen") from exc\n    except ValueError as exc:\n        raise HTTPException(status_code=409, detail=str(exc)) from exc\n'''
          replace_once(path, old, new)

          # The import above is intentionally used by the generic route only through
          # job state checks; keep lint clean if later simplification removes it.
          p = Path(path)
          text = p.read_text()
          if '    RunStatus,\n' in text and 'RunStatus.' not in text:
              text = text.replace('    RunStatus,\n', '', 1)
              p.write_text(text)

          # phase7.py — RETIRED is an atomic lifecycle stop for monitoring + autonomous jobs.
          path = "backend/src/quantlab/phase7.py"
          replace_once(
              path,
              '''            if target is MonitoringState.RETIRED:\n                run.ended_at = changed\n            session.flush()''',
              '''            if target is MonitoringState.RETIRED:\n                run.ended_at = changed\n                # Retirement must stop the deterministic managed schedules in the same\n                # DB transaction; generic job mutation is deliberately forbidden.\n                from quantlab.automation import ScheduledJob\n\n                job_ids = (\n                    hashlib.sha256(\n                        f"monitor-paper-deployment:{monitoring_id}".encode()\n                    ).hexdigest(),\n                    hashlib.sha256(\n                        f"paper-session:{run.deployment_id}".encode()\n                    ).hexdigest(),\n                )\n                for job_id in job_ids:\n                    job = session.get(ScheduledJob, job_id, with_for_update=True)\n                    if job is not None:\n                        job.enabled = False\n                        job.updated_at = changed\n            session.flush()''',
          )

          # worker.py — reconcile legacy persisted schedules before the first scheduler tick.
          path = "backend/src/quantlab/worker.py"
          replace_once(
              path,
              '''    scheduler = SchedulerService(repository)\n    worker = WorkerService(repository, settings)''',
              '''    scheduler = SchedulerService(repository)\n    worker = WorkerService(repository, settings)\n    reconciled = repository.reconcile_managed_schedules()\n    if reconciled:\n        logger.warning("Fail-closed disabled %s legacy/drifted autonomous schedules", reconciled)''',
          )

          # Operations UI — only offer retry for runs whose scheduled job is managed.
          path = "frontend/app/operations/page.tsx"
          replace_once(
              path,
              'type AutomationRun = Record<string, unknown> & { id?: string; status?: string };',
              '''type AutomationJob = Record<string, unknown> & { id?: string; job_type?: string };\ntype AutomationRun = Record<string, unknown> & {\n  id?: string;\n  status?: string;\n  scheduled_job_id?: string;\n};\n\nconst MANAGED_JOB_TYPES = new Set([\n  "RUN_PAPER_DEPLOYMENT",\n  "PREPARE_PAPER_SESSION",\n  "MONITOR_PAPER_DEPLOYMENT",\n]);''',
          )
          replace_once(
              path,
              '''  const admin = user?.role === "ADMIN";\n  const runs: AutomationRun[] = Array.isArray(data.runs) ? data.runs : [];\n  const recoverable = runs.filter((run) =>\n    ["FAILED", "DEAD_LETTER"].includes(String(run.status ?? "")),\n  );''',
              '''  const admin = user?.role === "ADMIN";\n  const jobs: AutomationJob[] = Array.isArray(data.jobs) ? data.jobs : [];\n  const managedJobIds = new Set(\n    jobs\n      .filter((job) => MANAGED_JOB_TYPES.has(String(job.job_type ?? "")))\n      .map((job) => String(job.id ?? ""))\n      .filter(Boolean),\n  );\n  const runs: AutomationRun[] = Array.isArray(data.runs) ? data.runs : [];\n  const recoverable = runs.filter((run) =>\n    ["FAILED", "DEAD_LETTER"].includes(String(run.status ?? ""))\n      && managedJobIds.has(String(run.scheduled_job_id ?? "")),\n  );''',
          )

          # Focused regression coverage.
          path = "backend/tests/test_pre_pilot_review_remediation.py"
          replace_once(
              path,
              '''    MONITOR_INTERVAL_SECONDS,\n    AutomationRepository,\n    MisfirePolicy,\n    ScheduleType,\n    ScheduledJob,''',
              '''    MONITOR_INTERVAL_SECONDS,\n    PREOPEN_EXECUTION_INTENT_BLOCK,\n    AutomationRepository,\n    JobRun,\n    JobType,\n    MisfirePolicy,\n    RunStatus,\n    ScheduleType,\n    ScheduledJob,''',
          )
          replace_once(
              path,
              'from quantlab.phase4 import Phase4Repository',
              'from quantlab.phase4 import AuditEventRecord, Phase4Repository',
          )
          p = Path(path)
          text = p.read_text()
          text += '''\n\ndef test_legacy_autonomous_schedule_is_disabled_before_polling(tmp_path) -> None:  # type: ignore[no-untyped-def]\n    database_url = f"sqlite:///{tmp_path / 'legacy-schedule.db'}"\n    Phase4Repository(database_url, bootstrap_test_schema=True).seed_account()\n    repository = AutomationRepository(database_url)\n    now = datetime(2026, 8, 29, 12, tzinfo=UTC)\n    job = repository.create_job(\n        job_type=JobType.PREPARE_PAPER_SESSION,\n        account_id="paper-main",\n        schedule_type=ScheduleType.INTERVAL,\n        interval_seconds=300,\n        next_run_at=now,\n        config={"deployment_id": "legacy-deployment"},\n    )\n    assert repository.reconcile_managed_schedules(now) == 1\n    with Session(repository.engine) as session:\n        stored = session.get(ScheduledJob, job.id)\n        assert stored is not None\n        assert stored.enabled is False\n\n\ndef test_managed_retry_and_audit_commit_in_one_repository_transaction(tmp_path) -> None:  # type: ignore[no-untyped-def]\n    database_url = f"sqlite:///{tmp_path / 'atomic-retry.db'}"\n    Phase4Repository(database_url, bootstrap_test_schema=True).seed_account()\n    repository = AutomationRepository(database_url)\n    now = datetime(2026, 8, 29, 12, tzinfo=UTC)\n    job = repository.create_job(\n        job_type=JobType.PREPARE_PAPER_SESSION,\n        account_id="paper-main",\n        schedule_type=ScheduleType.DAILY,\n        daily_time=AUTONOMOUS_DAILY_TIME,\n        timezone=AUTONOMOUS_TIMEZONE,\n        next_run_at=now,\n        misfire_policy=MisfirePolicy.SKIP_IF_TOO_OLD,\n        misfire_grace_seconds=1,\n        max_attempts=1,\n        config={"deployment_id": "deployment-test"},\n    )\n    with Session(repository.engine) as session:\n        session.add(\n            JobRun(\n                id="run-test",\n                scheduled_job_id=job.id,\n                occurrence_key="test:dead-letter",\n                scheduled_for=now,\n                status=RunStatus.DEAD_LETTER,\n                attempt_count=1,\n                fencing_token=1,\n                config_snapshot_json="{}",\n                correlation_id="original-correlation",\n                created_at=now,\n                finished_at=now,\n            )\n        )\n        session.commit()\n    retried = repository.retry_managed_run(\n        "run-test",\n        actor={"actor_id": "admin", "actor_role": "ADMIN", "authentication": "bearer"},\n        reason="operator recovery",\n        correlation_id="retry-correlation",\n        now=now + timedelta(seconds=1),\n    )\n    assert retried.status == RunStatus.RETRY_SCHEDULED\n    with Session(repository.engine) as session:\n        stored = session.get(JobRun, "run-test")\n        assert stored is not None and stored.status == RunStatus.RETRY_SCHEDULED\n        audit = session.query(AuditEventRecord).filter_by(\n            event_type="CONTROL_AUTOMATION_RUN_RETRY", entity_id="run-test"\n        ).one()\n        assert audit.correlation_id == "retry-correlation"\n\n\ndef test_autonomous_execution_stays_fail_closed_without_preopen_order_intent() -> None:\n    assert PREOPEN_EXECUTION_INTENT_BLOCK == "PREOPEN_EXECUTION_INTENT_NOT_PERSISTED"\n'''
          p.write_text(text)

          # Frontend source-level regression: managed-job identity participates in filtering.
          path = "frontend/tests/security.test.ts"
          replace_once(
              path,
              '''    expect(operations).toContain("Audit reason");\n    expect(operations).not.toContain("/run-now");''',
              '''    expect(operations).toContain("Audit reason");\n    expect(operations).toContain("scheduled_job_id");\n    expect(operations).toContain("MANAGED_JOB_TYPES");\n    expect(operations).not.toContain("/run-now");''',
          )
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/pr67-direct-remediation.yml

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit remediation
        shell: bash
        run: |
          git config user.name "PR67 remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix remaining PR67 runtime review findings"
          git push origin HEAD:fix/pre-pilot-review-remediation
