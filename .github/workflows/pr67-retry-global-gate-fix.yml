name: PR67 retry gate cleanup

on:
  push:
    branches:
      - fix/pre-pilot-review-remediation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pre-pilot-review-remediation
      - name: Allow audited retry persistence while execution is globally disabled
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/src/quantlab/api.py')
          text = p.read_text()
          old = '''@app.post("/operator/automation/runs/{run_id}/retry")\ndef operator_retry_automation_run(\n    run_id: str, body: ReasonedMutation, request: Request\n) -> dict[str, object]:\n    if not settings.automation_enabled:\n        raise HTTPException(status_code=503, detail="Automation je globálně vypnutá")\n    try:\n'''
          new = '''@app.post("/operator/automation/runs/{run_id}/retry")\ndef operator_retry_automation_run(\n    run_id: str, body: ReasonedMutation, request: Request\n) -> dict[str, object]:\n    # Recovery transition lze auditovaně persistovat i při globálně vypnutém workeru;\n    # samotná execution zůstává zastavená, dokud automation není znovu povolena.\n    try:\n'''
          if text.count(old) != 1:
              raise SystemExit('operator retry gate marker mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/pr67-retry-global-gate-fix.yml
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "PR67 remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Allow audited recovery while automation is paused"
          git push origin HEAD:fix/pre-pilot-review-remediation
