name: Temporary ESLint 10 Compatibility Check

on:
  push:
    branches:
      - maintenance/dependency-security-2026-08

permissions:
  contents: write

jobs:
  check-eslint-10:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.17.0
      - name: Verify toolchain
        run: |
          test "$(npm --version)" = "11.17.0"
      - name: Resolve ESLint 10 without bypasses
        working-directory: frontend
        run: npm install --save-dev --save-exact eslint@10
      - name: Validate frontend with ESLint 10
        working-directory: frontend
        run: |
          npm run lockfile:check
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
      - name: Commit ESLint 10 if fully compatible
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Aktualizuj ESLint na podporovanou řadu 10"
          git push origin HEAD:maintenance/dependency-security-2026-08
