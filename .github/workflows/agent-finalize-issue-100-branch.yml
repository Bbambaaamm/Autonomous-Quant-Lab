name: Finalize Issue 100 branch hardening

on:
  push:
    branches: [agent/issue-100-final-implementation]
    paths: [.github/workflows/agent-finalize-issue-100-branch.yml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Apply exact bounded hardening edits
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1:
                  raise SystemExit(f"expected exactly one match in {path}: {old[:80]!r}, got {s.count(old)}")
              p.write_text(s.replace(old,new,1))

          replace_once('.github/scripts/agent-pipeline.cjs',
          '''function normalizedFailureClass(job) {\n  const name = job.name.toLowerCase();\n  const steps = failedStepNames(job).join(" ");\n  const metadata = `${name} ${steps}`;''',
          '''function normalizedFailureClass(job, logExcerpt = "") {\n  const name = job.name.toLowerCase();\n  const steps = failedStepNames(job).join(" ");\n  const metadata = `${name} ${steps} ${String(logExcerpt || "").toLowerCase()}`;''')
          replace_once('.github/scripts/agent-pipeline.cjs',
          '''  const job = failed[0], failureClass = normalizedFailureClass(job);''',
          '''  const job = failed[0], failureClass = normalizedFailureClass(job, logExcerpt);''')

          replace_once('.github/workflows/agent-ci-fixer.yml',
          '''      fix_scope: ${{ steps.classify.outputs.fix_scope }}''',
          '''      fix_scope: ${{ steps.classify.outputs.fix_scope }}\n      transient_retry: ${{ steps.classify.outputs.transient_retry }}''')
          replace_once('.github/workflows/agent-ci-fixer.yml',
          '''            const p=require(`${process.env.GITHUB_WORKSPACE}/.trusted-policy/.github/scripts/agent-pipeline.cjs`), c=require(`${process.env.GITHUB_WORKSPACE}/.trusted-policy/.github/agent-pipeline.json`);''',
          '''            const p=require(`${process.env.GITHUB_WORKSPACE}/.trusted-policy/.github/scripts/agent-pipeline.cjs`), a=require(`${process.env.GITHUB_WORKSPACE}/.trusted-policy/.github/scripts/agent-autonomy.cjs`), c=require(`${process.env.GITHUB_WORKSPACE}/.trusted-policy/.github/agent-pipeline.json`);''')
          replace_once('.github/workflows/agent-ci-fixer.yml',
          '''            core.setOutput("failure_class",classification.failureClass);\n            if (classification.disposition!=="FIX") { core.setOutput("escalation","true"); core.setOutput("reason",classification.reason); return; }''',
          '''            core.setOutput("failure_class",classification.failureClass);\n            if (classification.failureClass==="infra-transient") {\n              const retry=a.transientCiRetryDecision({failureClass:classification.failureClass,runAttempt:run.run_attempt,maxRetries:c.v2.maxTransientCiRetries});\n              core.setOutput("budget_state",JSON.stringify(retry));\n              if(retry.action==="RETRY"){core.setOutput("transient_retry","true");return;}\n              if(retry.action==="NEEDS_HUMAN"){core.setOutput("escalation","true");core.setOutput("reason",retry.reason);return;}\n            }\n            if (classification.disposition!=="FIX") { core.setOutput("escalation","true"); core.setOutput("reason",classification.reason); return; }''')

          retry_job='''\n  retry-transient:\n    needs: classify\n    if: needs.classify.outputs.transient_retry == 'true'\n    runs-on: ubuntu-latest\n    permissions: {actions: write, contents: read, issues: read, pull-requests: read}\n    steps:\n      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4\n        with: {ref: '${{ github.event.repository.default_branch }}', path: .trusted-policy, persist-credentials: false}\n      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7\n        env: {PR: '${{ needs.classify.outputs.pr_number }}', ISSUE: '${{ needs.classify.outputs.issue_number }}', SHA: '${{ needs.classify.outputs.source_sha }}', CI_RUN: '${{ needs.classify.outputs.ci_run_id }}', CI_ATTEMPT: '${{ needs.classify.outputs.ci_run_attempt }}', CLASS: '${{ needs.classify.outputs.failure_class }}'}\n        with:\n          script: |\n            const p=require(`${process.env.GITHUB_WORKSPACE}/.trusted-policy/.github/scripts/agent-pipeline.cjs`),a=require(`${process.env.GITHUB_WORKSPACE}/.trusted-policy/.github/scripts/agent-autonomy.cjs`),c=require(`${process.env.GITHUB_WORKSPACE}/.trusted-policy/.github/agent-pipeline.json`);\n            const prNumber=Number(process.env.PR),issueNumber=Number(process.env.ISSUE),runId=Number(process.env.CI_RUN),attempt=Number(process.env.CI_ATTEMPT),sha=process.env.SHA;\n            if(process.env.CLASS!=="infra-transient")return core.setFailed("TRANSIENT_CLASS_MISMATCH");\n            const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:runId});\n            const {data:pr}=await github.rest.pulls.get({...context.repo,pull_number:prNumber});\n            const {data:issue}=await github.rest.issues.get({...context.repo,issue_number:issueNumber});\n            const prComments=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:prNumber,per_page:100});\n            const issueComments=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:issueNumber,per_page:100});\n            if(run.run_attempt!==attempt||!p.authoritativeCiIdentity(run,{prNumber,headSha:sha,conclusion:"failure"})||pr.head.sha!==sha||pr.state!=="open"||!p.lifecycleAtAgentPr(pr.labels,issue.labels).ok||!p.fullLinkageDecision({prBody:pr.body,prComments,issueComments,...context.repo,issueNumber,prNumber}).ok)return core.setFailed("TRANSIENT_RETRY_TOCTOU_REJECTED");\n            const retry=a.transientCiRetryDecision({failureClass:"infra-transient",runAttempt:attempt,maxRetries:c.v2.maxTransientCiRetries});\n            if(retry.action!=="RETRY")return core.setFailed(retry.reason||"TRANSIENT_RETRY_NOT_ALLOWED");\n            await github.rest.actions.reRunWorkflowFailedJobs({...context.repo,run_id:runId});\n            core.notice(`Bounded transient CI retry requested: attempt ${retry.nextAttempt}`);\n\n'''
          replace_once('.github/workflows/agent-ci-fixer.yml','''\n  record-classification:\n''',retry_job+'''  record-classification:\n''')

          replace_once('.github/workflows/ci.yml',
          '''        run: node --test .github/scripts/agent-pipeline.test.cjs''',
          '''        run: node --test .github/scripts/agent-pipeline.test.cjs .github/scripts/agent-autonomy.test.cjs''')

          test_file=Path('.github/scripts/agent-autonomy.test.cjs')
          s=test_file.read_text()
          extra='''\n\ntest("CI classifier recognizes npm registry 503 as infra-transient before security", () => {\n  const p = require("./agent-pipeline.cjs");\n  const sha = "c".repeat(40);\n  const result = p.classifyCiFailure({\n    jobs: [{ id: 7, name: "security", conclusion: "failure", steps: [{ name: "Run npm audit --audit-level=critical", conclusion: "failure" }] }],\n    runHeadSha: sha, expectedHeadSha: sha, sourceRunId: 77, runAttempt: 1,\n    logExcerpt: "npm warn audit 503 Service Unavailable\\nnpm error audit endpoint returned an error",\n    config: { requiredCiJobs: ["security"], failureClassPolicy: { eligible: [], denied: ["infra-transient", "security"] }, protectedDiagnosticPatterns: [] },\n  });\n  assert.equal(result.failureClass, "infra-transient");\n  assert.equal(result.disposition, "NEEDS_HUMAN");\n});\n'''
          if 'CI classifier recognizes npm registry 503' not in s:
              test_file.write_text(s+extra)

          Path('.github/workflows/agent-finalize-issue-100-branch.yml').unlink()
          PY
      - name: Validate complete candidate without write credential
        run: |
          set -euo pipefail
          node --test .github/scripts/agent-pipeline.test.cjs .github/scripts/agent-autonomy.test.cjs
          python -m json.tool .github/agent-pipeline.json >/dev/null
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].sort.each { |path| YAML.load_file(path, aliases: true) }'
          git diff --check
          git add -A
          git diff --cached --check
          mapfile -t paths < <(git diff --cached --name-only | sort)
          printf '%s\n' "${paths[@]}" > "$RUNNER_TEMP/paths"
          cat > "$RUNNER_TEMP/expected" <<'EOF'
          .github/scripts/agent-autonomy.test.cjs
          .github/scripts/agent-pipeline.cjs
          .github/workflows/agent-ci-fixer.yml
          .github/workflows/agent-finalize-issue-100-branch.yml
          .github/workflows/ci.yml
          EOF
          sort -o "$RUNNER_TEMP/expected" "$RUNNER_TEMP/expected"
          cmp "$RUNNER_TEMP/expected" "$RUNNER_TEMP/paths"
          git diff --cached --binary > "$RUNNER_TEMP/finalize.patch"
          sha256sum "$RUNNER_TEMP/finalize.patch" > "$RUNNER_TEMP/finalize.patch.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-100-finalize-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/finalize.patch
            ${{ runner.temp }}/finalize.patch.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: 'issue-100-finalize-${{ github.run_id }}', path: '${{ runner.temp }}'}
      - name: Reapply exact validated patch and commit without credential
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum -c finalize.patch.sha256
          cd "$GITHUB_WORKSPACE"
          git apply --check "$RUNNER_TEMP/finalize.patch"
          git apply "$RUNNER_TEMP/finalize.patch"
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize Issue 100 autonomous pipeline hardening'
      - name: Trusted fast-forward publication only
        env:
          GH_TOKEN: ${{ secrets.AGENT_PUBLISH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(git rev-parse HEAD^)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          git remote set-url origin "https://github.com/${GH_REPO}.git"
          gh auth setup-git
          git push origin HEAD:refs/heads/agent/issue-100-final-implementation
