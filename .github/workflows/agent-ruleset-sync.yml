name: Agent Protect main read-only audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Audit current protection without changing repository settings
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RULESET_AUDIT_TOKEN: '${{ secrets.AGENT_PUBLISH_TOKEN }}'
        with:
          script: |
            const m = require('./.github/scripts/agent-maintenance-runtime.cjs');
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const {data: branch} = await github.rest.repos.getBranch({
              ...context.repo, branch: context.payload.repository.default_branch,
            });
            if (context.ref !== `refs/heads/${context.payload.repository.default_branch}` || branch.commit.sha !== context.sha) {
              throw new Error('STALE_OR_NON_DEFAULT_WORKFLOW_REVISION');
            }
            const ruleset = await m.rulesetReader(repository, process.env.RULESET_AUDIT_TOKEN)();
            core.notice(`READ_ONLY_AUDIT_PASS ruleset=${ruleset.id} fingerprint=${m.digest(m.protection(ruleset))}`);
            await core.summary.addHeading('Protect main read-only audit')
              .addRaw('Validated eight CI contexts, strict freshness, PR/deletion/non-fast-forward protections, explicit zero bypass actors and CodeQL. No settings were changed. The agent gate remains an internal requirement of autonomous merging.')
              .write();

      - name: Open or refresh ruleset drift alert
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = '[architecture] Protect main ruleset drift';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The scheduled Protect main ruleset audit failed.',
              '',
              `Workflow run: ${runUrl}`,
              `Observed at: ${new Date().toISOString()}`,
              '',
              'Treat this as an architecture-control-plane incident until the ruleset is verified.',
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'all', per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (!existing) {
              await github.rest.issues.create({...context.repo, title, body, labels: ['enhancement']});
            } else {
              if (existing.state !== 'open') {
                await github.rest.issues.update({...context.repo, issue_number: existing.number, state: 'open'});
              }
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body});
            }
