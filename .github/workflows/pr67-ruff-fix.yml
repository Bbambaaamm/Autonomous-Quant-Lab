name: PR67 ruff cleanup

on:
  push:
    branches:
      - fix/pre-pilot-review-remediation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pre-pilot-review-remediation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
      - name: Apply ruff safe fixes
        shell: bash
        run: |
          cd backend
          uv sync --locked --all-groups
          uv run ruff check --fix .
          uv run ruff format .
          cd ..
          rm .github/workflows/pr67-ruff-fix.yml
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "PR67 remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix PR67 lint issues"
          git push origin HEAD:fix/pre-pilot-review-remediation
