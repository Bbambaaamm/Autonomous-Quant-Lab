name: Apply bootstrap review fixes

on:
  push:
    branches:
      - bootstrap/issue-100-autonomous-pipeline
    paths:
      - .github/workflows/apply-bootstrap-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'Bbambaaamm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: bootstrap/issue-100-autonomous-pipeline
          fetch-depth: 0
      - name: Apply exact reviewed fixes
        run: python .github/scripts/apply-bootstrap-review-fixes.py
      - name: Validate patched workflow
        run: |
          git diff --check
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/bootstrap-issue-100-publisher.yml", aliases: true)'
      - name: Export patched workflow as inert blob
        run: |
          cp .github/workflows/bootstrap-issue-100-publisher.yml .github/bootstrap-patched-output.txt
          git checkout -- .github/workflows/bootstrap-issue-100-publisher.yml
          git add .github/bootstrap-patched-output.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Export patched bootstrap workflow blob'
          git push origin HEAD:bootstrap/issue-100-autonomous-pipeline
