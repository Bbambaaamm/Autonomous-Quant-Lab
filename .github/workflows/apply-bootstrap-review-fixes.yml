name: Apply bootstrap review fixes

on:
  push:
    branches:
      - bootstrap/issue-100-autonomous-pipeline
    paths:
      - .github/workflows/apply-bootstrap-review-fixes.yml

permissions:
  contents: read

jobs:
  apply:
    if: github.actor == 'Bbambaaamm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: bootstrap/issue-100-autonomous-pipeline
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact reviewed fixes without write credential
        run: python .github/scripts/apply-bootstrap-review-fixes.py
      - name: Validate patched workflow without write credential
        run: |
          git diff --check
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/bootstrap-issue-100-publisher.yml", aliases: true)'
      - name: Trusted final publication and self-cleanup
        env:
          GH_TOKEN: ${{ secrets.AGENT_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          git add .github/workflows/bootstrap-issue-100-publisher.yml
          git rm -f .github/scripts/apply-bootstrap-review-fixes.py .github/workflows/apply-bootstrap-review-fixes.yml
          git ls-files '.github/bootstrap-*' | xargs -r git rm -f --
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden bootstrap publisher recovery checks'
          gh auth setup-git
          git push origin HEAD:bootstrap/issue-100-autonomous-pipeline
