name: Agent Builder trusted publish

on:
  workflow_call:
    inputs:
      issue_number: {required: true, type: string}
      spec_hash: {required: true, type: string}
      base_sha: {required: true, type: string}
    secrets:
      AGENT_PUBLISH_TOKEN: {required: true}

permissions: {contents: read}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: {actions: write, contents: read, issues: write, pull-requests: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: '${{ inputs.base_sha }}', persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: 'builder-sealed-${{ github.run_id }}', path: '${{ runner.temp }}/s'}
      - name: Reconstruct sealed commit without credential
        run: |
          set -euo pipefail
          test "$(sha256sum "$RUNNER_TEMP/s/validated.patch"|cut -d' ' -f1)" = "$(cat "$RUNNER_TEMP/s/validated.sha256")"
          test "$(jq -r .base_sha "$RUNNER_TEMP/s/validated.json")" = '${{ inputs.base_sha }}'
          test "$(jq -r .spec_hash "$RUNNER_TEMP/s/validated.json")" = '${{ inputs.spec_hash }}'
          git apply --check "$RUNNER_TEMP/s/validated.patch"
          git apply "$RUNNER_TEMP/s/validated.patch"
          git add -A
          test "$(git write-tree)" = "$(jq -r .tree_sha "$RUNNER_TEMP/s/validated.json")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          d="$(git show -s --format=%cI '${{ inputs.base_sha }}')"
          tree="$(git write-tree)"
          GIT_AUTHOR_DATE="$d" GIT_COMMITTER_DATE="$d" git commit -m 'Autonomous Builder candidate for Issue #${{ inputs.issue_number }}' -m "Agent-Builder-Seal: v1 issue=${{ inputs.issue_number }} spec=${{ inputs.spec_hash }} base=${{ inputs.base_sha }} tree=$tree"
      - id: p
        name: Publish with isolated credential
        env: {GH_TOKEN: '${{ secrets.AGENT_PUBLISH_TOKEN }}', JOB_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}', ISSUE: '${{ inputs.issue_number }}', SPEC: '${{ inputs.spec_hash }}', BASE: '${{ inputs.base_sha }}'}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$JOB_TOKEN"
          owner="${GH_REPO%%/*}"
          branch="agent/issue-${ISSUE}-${SPEC:0:12}-${BASE:0:12}"
          sealed="$(git rev-parse HEAD)"; expected_tree="$(jq -r .tree_sha "$RUNNER_TEMP/s/validated.json")"; test "$(jq -r .base_sha "$RUNNER_TEMP/s/validated.json")" = "$BASE"; test "$(jq -r .spec_hash "$RUNNER_TEMP/s/validated.json")" = "$SPEC"
          git remote set-url origin "https://github.com/${GH_REPO}.git"
          AUTH_HEADER="AUTHORIZATION: basic $(printf x-access-token:%s "$GH_TOKEN" | base64 -w0)"
          revalidate_issue(){
            local issue_file="$RUNNER_TEMP/publish-issue.json" comments_file="$RUNNER_TEMP/publish-comments.json"
            GH_TOKEN="$JOB_TOKEN" gh api "repos/$GH_REPO/issues/$ISSUE" > "$issue_file"
            GH_TOKEN="$JOB_TOKEN" gh api --paginate --slurp "repos/$GH_REPO/issues/$ISSUE/comments?per_page=100" | jq 'add // []' > "$comments_file"
            ISSUE_FILE="$issue_file" COMMENTS_FILE="$comments_file" node -e 'const fs=require("fs"),a=require("./.github/scripts/agent-autonomy.cjs"),p=require("./.github/scripts/agent-pipeline.cjs"),issue=JSON.parse(fs.readFileSync(process.env.ISSUE_FILE,"utf8")),comments=JSON.parse(fs.readFileSync(process.env.COMMENTS_FILE,"utf8")),n=Number(process.env.ISSUE),auth=a.authorizationDecision({comments,repo:process.env.GH_REPO,issueNumber:n,title:issue.title,body:issue.body||"",labels:issue.labels,state:issue.state});if(!auth.ok||auth.specHash!==process.env.SPEC||!p.isImplementation(issue.labels)||!a.exactAgentState(issue.labels,"agent:running"))process.exit(1);'
          }
          owned(){
          local sha="$1" m p t
          test "$sha" = "$sealed" || return 1
          m="$(GH_TOKEN="$JOB_TOKEN" gh api "repos/$GH_REPO/git/commits/$sha" --jq .message)" || return 1
          p="$(GH_TOKEN="$JOB_TOKEN" gh api "repos/$GH_REPO/commits/$sha" --jq '.parents[0].sha')" || return 1
          t="$(GH_TOKEN="$JOB_TOKEN" gh api "repos/$GH_REPO/git/commits/$sha" --jq '.tree.sha')" || return 1
          test "$p" = "$BASE" || return 1
          test "$t" = "$expected_tree" || return 1
          grep -Fxq "Agent-Builder-Seal: v1 issue=$ISSUE spec=$SPEC base=$BASE tree=$expected_tree" <<<"$m" || return 1
          return 0
          }
          prs(){ GH_TOKEN="$JOB_TOKEN" gh api --paginate --slurp -X GET "repos/$GH_REPO/pulls" -f state=open -f per_page=100 -f head="$owner:$branch"|jq --arg r "$GH_REPO" --arg b "$branch" '[.[][]|select(.head.repo.full_name==$r and .head.ref==$b)]'; }
          q="$(prs)"
          test "$(jq length<<<"$q")" -le 1
          if test "$(jq length<<<"$q")" -eq 1; then
            sha="$(jq -r '.[0].head.sha'<<<"$q")"
            owned "$sha"
          else
            remote="$(git -c http.extraheader="$AUTH_HEADER" ls-remote --refs origin "refs/heads/$branch" | awk '{print $1}')"
            if test -n "$remote"; then
              owned "$remote"
              sha="$remote"
            else
              test -z "$remote"
              revalidate_issue
              git -c http.extraheader="$AUTH_HEADER" push origin "HEAD:refs/heads/$branch"
              sha="$(git -c http.extraheader="$AUTH_HEADER" ls-remote --refs origin "refs/heads/$branch" | awk '{print $1}')"
              test "$sha" = "$sealed"
            fi
            parent="$(GH_TOKEN="$JOB_TOKEN" gh api "repos/$GH_REPO/commits/$sha" --jq '.parents[0].sha')"
            tree="$(GH_TOKEN="$JOB_TOKEN" gh api "repos/$GH_REPO/git/commits/$sha" --jq '.tree.sha')"
            test "$parent" = "$BASE"
            cat > "$RUNNER_TEMP/body" <<BODY
          Implements the exact authorized Issue #$ISSUE through the trusted autonomous Builder.

          - Agent-Issue: #$ISSUE
          <!-- agent-builder-publish:v1 issue=$ISSUE spec=$SPEC base=$parent tree=$tree -->
          BODY
            revalidate_issue
            gh pr create --repo "$GH_REPO" --draft --base main --head "$branch" --title "Agent: Issue #$ISSUE" --body-file "$RUNNER_TEMP/body"
            q="$(prs)"
            test "$(jq length<<<"$q")" -eq 1
          fi
          echo "pr=$(jq -r '.[0].number'<<<"$q")" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Link, transition, release Draft and recover completed CI
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env: {ISSUE: '${{ inputs.issue_number }}', SPEC: '${{ inputs.spec_hash }}', PR: '${{ steps.p.outputs.pr }}', HEAD: '${{ steps.p.outputs.sha }}', BASE: '${{ inputs.base_sha }}', READY_TOKEN: '${{ secrets.AGENT_PUBLISH_TOKEN }}'}
        with:
          script: |
            const p=require('./.github/scripts/agent-pipeline.cjs'),a=require('./.github/scripts/agent-autonomy.cjs'),n=Number(process.env.ISSUE),prn=Number(process.env.PR),repo=`${context.repo.owner}/${context.repo.repo}`,def=context.payload.repository.default_branch;
            const snapshot=async()=>{
              const {data:pr}=await github.rest.pulls.get({...context.repo,pull_number:prn});
              const {data:i}=await github.rest.issues.get({...context.repo,issue_number:n});
              const ic=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:n,per_page:100});
              const pc=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:prn,per_page:100});
              const commits=await github.paginate(github.rest.pulls.listCommits,{...context.repo,pull_number:prn,per_page:100});
              const auth=a.authorizationDecision({comments:ic,repo,issueNumber:n,title:i.title,body:i.body||'',labels:i.labels,state:i.state});
              const il=p.durablePrLinkDecision(ic,{...context.repo,issueNumber:n}),pl=p.durableIssueLinkDecision(pc,{...context.repo,prNumber:prn});
              return {pr,i,ic,pc,commits,auth,il,pl};
            };
            const immutableBindingOk=s=>s.auth.ok&&s.auth.specHash===process.env.SPEC&&s.i.state==='open'&&p.isImplementation(s.i.labels)&&s.pr.state==='open'&&s.pr.head.sha===process.env.HEAD&&s.pr.base.ref===def&&p.parseAgentIssue(s.pr.body)===n&&s.commits.length===1&&s.commits[0].parents?.[0]?.sha===process.env.BASE;
            const linkConflict=s=>!s.il.ok||!s.pl.ok||(s.il.prNumber!==null&&s.il.prNumber!==prn)||(s.pl.issueNumber!==null&&s.pl.issueNumber!==n);
            const fullLinkOk=s=>p.fullLinkageDecision({prBody:s.pr.body,prComments:s.pc,issueComments:s.ic,...context.repo,issueNumber:n,prNumber:prn}).ok;
            const prStates=s=>a.labelNames(s.pr.labels).filter(x=>x.startsWith('agent:'));
            const preLinkLifecycleOk=s=>(a.exactAgentState(s.i.labels,'agent:running')||a.exactAgentState(s.i.labels,'agent:pr'))&&(prStates(s).length===0||(prStates(s).length===1&&prStates(s)[0]==='agent:pr'));
            const marker=`<!-- agent-link:v1 repo=${repo} issue=${n} pr=${prn} -->`;
            let s=await snapshot();
            if(!immutableBindingOk(s)||linkConflict(s)||!preLinkLifecycleOk(s)) return core.setFailed('PUBLISH_SCOPE_REJECTED');
            if(s.il.prNumber===null){
              s=await snapshot(); if(!immutableBindingOk(s)||linkConflict(s)||!preLinkLifecycleOk(s)) return core.setFailed('LINK_BINDING_CHANGED');
              if(s.il.prNumber===null) await github.rest.issues.createComment({...context.repo,issue_number:n,body:`Linked autonomous PR #${prn}.\n\n${marker}`});
            }
            s=await snapshot();
            if(!immutableBindingOk(s)||linkConflict(s)||!preLinkLifecycleOk(s)) return core.setFailed('LINK_BINDING_CHANGED');
            if(s.pl.issueNumber===null){
              s=await snapshot(); if(!immutableBindingOk(s)||linkConflict(s)||!preLinkLifecycleOk(s)) return core.setFailed('LINK_BINDING_CHANGED');
              if(s.pl.issueNumber===null) await github.rest.issues.createComment({...context.repo,issue_number:prn,body:`Linked authorized Issue #${n}.\n\n${marker}`});
            }
            const state=async(num,labels)=>github.rest.issues.setLabels({...context.repo,issue_number:num,labels:[...a.labelNames(labels).filter(x=>!x.startsWith('agent:')),'agent:pr']});
            s=await snapshot();
            if(!immutableBindingOk(s)||!fullLinkOk(s)||linkConflict(s)||!preLinkLifecycleOk(s)) return core.setFailed('PUBLISH_STATE_CHANGED');
            if(a.exactAgentState(s.i.labels,'agent:running')) await state(n,s.i.labels);
            s=await snapshot();
            const states=prStates(s);
            if(!immutableBindingOk(s)||!fullLinkOk(s)||linkConflict(s)||!a.exactAgentState(s.i.labels,'agent:pr')||(states.length>0&&!(states.length===1&&states[0]==='agent:pr'))) return core.setFailed('PUBLISH_STATE_CHANGED');
            if(states.length===0) await state(prn,s.pr.labels);

            s=await snapshot();
            const readyAuth=s.auth;
            const readyLifecycle=a.lifecyclePairDecision(s.pr.labels,s.i.labels,'agent:pr');
            const readyLink=p.fullLinkageDecision({prBody:s.pr.body,prComments:s.pc,issueComments:s.ic,...context.repo,issueNumber:n,prNumber:prn});
            if(!immutableBindingOk(s)||!readyAuth.ok||readyAuth.specHash!==process.env.SPEC||!readyLifecycle.ok||!readyLink.ok) return core.setFailed('READY_PRECONDITION_FAILED');
            let {pr}=s;
            if(pr.draft){
              const readyToken=process.env.READY_TOKEN;
              if(!readyToken) return core.setFailed(a.draftReadyResponseDecision({tokenPresent:false}).reason);
              let response;
              let payload=null;
              try{
                response=await fetch('https://api.github.com/graphql',{
                  method:'POST',
                  headers:{authorization:`Bearer ${readyToken}`,accept:'application/vnd.github+json','content-type':'application/json','user-agent':'agent-builder-publish'},
                  body:JSON.stringify({query:'mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{id isDraft}}}',variables:{id:pr.node_id}}),
                });
                payload=await response.json().catch(()=>null);
              }catch{
                return core.setFailed('READY_HTTP_FAILED');
              }
              const released=payload?.data?.markPullRequestReadyForReview?.pullRequest;
              const decision=a.draftReadyResponseDecision({
                tokenPresent:true,
                httpOk:response.ok,
                graphqlErrors:payload?.errors,
                releasedId:released?.id,
                expectedId:pr.node_id,
                releasedIsDraft:released?.isDraft,
              });
              if(!decision.ok) return core.setFailed(`${decision.reason}:${response.status}`);
            }
            s=await snapshot(); pr=s.pr;
            const readyPostcondition=a.draftReadyPostconditionDecision({draft:pr.draft});
            if(!readyPostcondition.ok) return core.setFailed(readyPostcondition.reason);
            if(!immutableBindingOk(s)||!a.lifecyclePairDecision(pr.labels,s.i.labels,'agent:pr').ok||!p.fullLinkageDecision({prBody:pr.body,prComments:s.pc,issueComments:s.ic,...context.repo,issueNumber:n,prNumber:prn}).ok||pr.draft) return core.setFailed('PUBLISH_POSTCONDITION_FAILED');

            const runs=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{...context.repo,event:'pull_request',head_sha:pr.head.sha,per_page:100});
            const exact=runs.filter(run=>run.name==='CI'&&run.head_sha===pr.head.sha&&run.pull_requests?.length===1&&run.pull_requests[0].number===prn).sort((x,y)=>y.id-x.id);
            if(exact.length===0) return core.notice('POST_LINK_CI_NOT_STARTED');
            const ci=exact[0];
            if(ci.status!=='completed') return core.notice('POST_LINK_CI_IN_PROGRESS');
            if(ci.conclusion==='success'){
              await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'agent-codex-review.yml',ref:def,inputs:{pr_number:String(prn),head_sha:pr.head.sha}});
            }else if(ci.conclusion==='failure'){
              await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'agent-ci-fixer.yml',ref:def,inputs:{invocation_mode:'failed-ci',pr_number:String(prn),head_sha:pr.head.sha,ci_run_id:String(ci.id)}});
            }else{
              return core.setFailed(`POST_LINK_CI_UNSUPPORTED_CONCLUSION:${ci.conclusion}`);
            }