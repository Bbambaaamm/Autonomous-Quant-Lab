name: Temporary Dependency Refresh

on:
  push:
    branches:
      - maintenance/dependency-security-2026-08

permissions:
  contents: write

jobs:
  refresh-frontend-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@11.17.0
      - name: Verify toolchain
        run: |
          node --version
          npm --version
          test "$(npm --version)" = "11.17.0"
      - name: Apply security patch dependencies
        working-directory: frontend
        run: |
          npm install --save-exact next@16.3.3
          npm install --save-dev --save-exact eslint-config-next@16.3.3
      - name: Validate lock and frontend
        working-directory: frontend
        run: |
          npm run lockfile:check
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "Aktualizuj Next.js security patch"
          git push origin HEAD:maintenance/dependency-security-2026-08
