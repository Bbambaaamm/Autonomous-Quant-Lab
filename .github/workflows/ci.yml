name: CI
on: [push, pull_request]
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.3"
  NODE_VERSION: "24"
  NPM_VERSION: "11.17.0"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv --version
      - run: uv lock --check
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src/quantlab

  unit-research:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups
      - run: >-
          uv run pytest -q
          tests/test_research.py
          tests/test_research_engine.py
          tests/test_phase6.py
          tests/test_xnys_calendar.py
          tests/test_paper_only_architecture.py
          tests/test_phase6_runtime.py
          tests/test_phase6_audit_fixes.py
          tests/test_phase6_experiment_audit.py
          tests/test_phase7.py

  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run pytest -q tests/test_vertical_slice.py tests/test_phase7_api.py tests/test_phase8_api.py tests/test_phase9_security.py

  integration-postgres:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: quantlab, POSTGRES_USER: quantlab, POSTGRES_HOST_AUTH_METHOD: trust}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantlab -d quantlab"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://quantlab@localhost:5432/quantlab
      RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run alembic -c ../alembic.ini upgrade head
      - name: PostgreSQL Phase 3–8, concurrency a recovery
        run: >-
          uv run pytest -q
          tests/test_phase3_platform.py
          tests/test_phase4.py
          tests/test_phase5.py
          tests/test_phase5_postgres.py
          tests/test_phase6.py
          tests/test_phase6_runtime.py
          tests/test_xnys_calendar.py
          tests/test_paper_only_architecture.py
          tests/test_phase6_postgres.py
          tests/test_phase6_audit_fixes.py
          tests/test_phase6_experiment_audit.py
          tests/test_phase6_current_data_postgres.py
          tests/test_phase6_e2e_postgres.py
          tests/test_phase7.py
          tests/test_phase7_postgres.py
          tests/test_phase7_e2e_postgres.py
          tests/test_phase7_automation_postgres.py
          tests/test_phase7_corporate_actions_postgres.py
          tests/test_phase8_postgres.py

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Verify Node and npm toolchain
        run: |
          node --version
          npm --version
          test "$(node --version | cut -d. -f1)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
          test "$(node -p "require('./package.json').packageManager")" = "npm@${NPM_VERSION}"
      - name: Validate dependency lock
        run: npm run lockfile:check
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.12.3", working-directory: backend}
      - run: uv sync --locked --all-groups
        working-directory: backend
      - run: uv run ruff check --select S src
        working-directory: backend
      - run: uvx --from pip-audit==2.9.0 pip-audit --strict
        working-directory: backend
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm install --global npm@11.17.0
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm audit --audit-level=critical
        working-directory: frontend
      - name: Repository secret and misconfiguration scan
        run: >-
          docker run --rm -v "$PWD:/work:ro" aquasec/trivy:0.66.0
          filesystem --exit-code 1 --scanners secret,misconfig /work

  container-build:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: docker build -f backend/Dockerfile -t quantlab-backend .
      - run: docker build -f frontend/Dockerfile -t quantlab-frontend .
      - run: test "$(docker run --rm --entrypoint id quantlab-backend -u)" != 0
      - run: test "$(docker run --rm --entrypoint id quantlab-frontend -u)" != 0
      - run: docker run --rm aquasec/trivy:0.66.0 image --exit-code 1 --severity HIGH,CRITICAL quantlab-backend
      - run: docker run --rm aquasec/trivy:0.66.0 image --exit-code 1 --severity HIGH,CRITICAL quantlab-frontend
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.66.0 image --format cyclonedx --output /tmp/backend-sbom.json quantlab-backend
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.66.0 image --format cyclonedx --output /tmp/frontend-sbom.json quantlab-frontend
