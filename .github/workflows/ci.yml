name: CI
on: [push, pull_request]
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.3"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv --version
      - run: uv lock --check
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src/quantlab

  unit-research:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups
      - run: >-
          uv run pytest -q
          tests/test_research.py
          tests/test_research_engine.py
          tests/test_phase6.py
          tests/test_xnys_calendar.py
          tests/test_paper_only_architecture.py
          tests/test_phase6_runtime.py

  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run pytest -q tests/test_vertical_slice.py

  integration-postgres:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: quantlab, POSTGRES_USER: quantlab, POSTGRES_HOST_AUTH_METHOD: trust}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantlab -d quantlab"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://quantlab@localhost:5432/quantlab
      RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run alembic -c ../alembic.ini upgrade head
      - name: PostgreSQL Phase 3–6, concurrency a recovery
        run: >-
          uv run pytest -q
          tests/test_phase3_platform.py
          tests/test_phase4.py
          tests/test_phase5.py
          tests/test_phase5_postgres.py
          tests/test_phase6.py
          tests/test_phase6_runtime.py
          tests/test_xnys_calendar.py
          tests/test_paper_only_architecture.py
          tests/test_phase6_postgres.py
