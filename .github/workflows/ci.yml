name: CI
on: [push, pull_request]
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.3"
  NODE_VERSION: "24"
  NPM_VERSION: "11.17.0"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv --version
      - run: uv lock --check
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src/quantlab

  unit-research:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups
      - run: >-
          uv run pytest -q
          tests/test_research.py
          tests/test_research_engine.py
          tests/test_phase6.py
          tests/test_xnys_calendar.py
          tests/test_paper_only_architecture.py
          tests/test_phase6_runtime.py
          tests/test_phase6_audit_fixes.py
          tests/test_phase6_experiment_audit.py
          tests/test_phase7.py

  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run pytest -q tests/test_vertical_slice.py tests/test_phase7_api.py tests/test_phase8_api.py tests/test_phase9_security.py

  integration-postgres:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: quantlab, POSTGRES_USER: quantlab, POSTGRES_PASSWORD: phase9-ci-password}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantlab -d quantlab"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://quantlab:phase9-ci-password@localhost:5432/quantlab
      RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups
      - name: Migrator role applies Alembic head with password authentication
        run: uv run alembic -c ../alembic.ini upgrade head
      - name: PostgreSQL Phase 3–9, least privilege, concurrency a recovery
        run: >-
          uv run pytest -q
          tests/test_phase3_platform.py
          tests/test_phase4.py
          tests/test_phase5.py
          tests/test_phase5_postgres.py
          tests/test_phase6.py
          tests/test_phase6_runtime.py
          tests/test_xnys_calendar.py
          tests/test_paper_only_architecture.py
          tests/test_phase6_postgres.py
          tests/test_phase6_audit_fixes.py
          tests/test_phase6_experiment_audit.py
          tests/test_phase6_current_data_postgres.py
          tests/test_phase6_e2e_postgres.py
          tests/test_phase7.py
          tests/test_phase7_postgres.py
          tests/test_phase7_e2e_postgres.py
          tests/test_phase7_automation_postgres.py
          tests/test_phase7_corporate_actions_postgres.py
          tests/test_phase8_postgres.py
          tests/test_phase9_postgres.py
      - name: Recreate clean application schema for B1 acceptance
        run: |
          uv run alembic -c ../alembic.ini downgrade base
          uv run alembic -c ../alembic.ini upgrade head
      - name: B1 control-plane end-to-end acceptance
        run: uv run pytest -q tests/test_b1_control_plane_postgres.py
      - name: B2 approved-deployment worker end-to-end acceptance
        run: uv run pytest -q tests/test_b2_worker_postgres.py

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Verify Node and npm toolchain
        run: |
          node --version
          npm --version
          test "$(node --version | cut -d. -f1)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
          test "$(node -p "require('./package.json').packageManager")" = "npm@${NPM_VERSION}"
      - name: Validate dependency lock
        run: npm run lockfile:check
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: {version: "0.12.3", working-directory: backend}
      - run: uv sync --locked --all-groups
        working-directory: backend
      - run: uv run ruff check --select S src
        working-directory: backend
      - run: uvx --from pip-audit==2.9.0 pip-audit --strict
        working-directory: backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm install --global npm@11.17.0
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm audit --audit-level=critical
        working-directory: frontend
      - name: Repository secret and misconfiguration scan
        run: >-
          docker run --rm -v "$PWD:/work:ro" aquasec/trivy:0.66.0
          filesystem --exit-code 1 --scanners secret,misconfig /work

  container-build:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - run: docker build -f backend/Dockerfile -t quantlab-backend .
      - run: docker build -f frontend/Dockerfile -t quantlab-frontend .
      - run: test "$(docker run --rm --entrypoint /app/backend/.venv/bin/python quantlab-backend -c 'import os; print(os.getuid())')" != 0
      - run: test "$(docker run --rm --entrypoint /usr/local/bin/node quantlab-frontend -e 'console.log(process.getuid())')" != 0
      - name: Verify minimal production runtimes
        run: |
          docker run --rm --entrypoint /app/backend/.venv/bin/python quantlab-backend -c \
            "import ctypes,numpy,pandas,pathlib,psycopg,pydantic_core,pyarrow,sys; ctypes.CDLL('libgcc_s.so.1'); assert sys.version_info[:2] == (3,12); assert not any(pathlib.Path('/usr/local/bin').glob('pip*')); assert not pathlib.Path('/usr/local/bin/uv').exists()"
          docker run --rm --entrypoint /usr/local/bin/node quantlab-frontend -e \
            "const fs=require('node:fs'); if(process.versions.node.split('.')[0] !== '24' || ['/usr/local/bin/npm','/usr/local/bin/yarn','/bin/sh'].some(fs.existsSync)) process.exit(1)"
          test "$(docker inspect --format '{{json .Config.Healthcheck.Test}}' quantlab-backend)" != null
          test "$(docker inspect --format '{{json .Config.Healthcheck.Test}}' quantlab-frontend)" != null
      - run: docker save quantlab-backend --output "$RUNNER_TEMP/backend-image.tar"
      - run: docker save quantlab-frontend --output "$RUNNER_TEMP/frontend-image.tar"
      - run: >-
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" aquasec/trivy:0.66.0
          image --input /scan/backend-image.tar --severity HIGH,CRITICAL
          --scanners vuln --skip-version-check
      - run: >-
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" aquasec/trivy:0.66.0
          image --input /scan/backend-image.tar --exit-code 1
          --severity HIGH,CRITICAL --scanners vuln --skip-version-check
      - run: >-
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" aquasec/trivy:0.66.0
          image --input /scan/frontend-image.tar --severity HIGH,CRITICAL
          --scanners vuln --skip-version-check
      - run: >-
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" aquasec/trivy:0.66.0
          image --input /scan/frontend-image.tar --exit-code 1
          --severity HIGH,CRITICAL --scanners vuln --skip-version-check
      - run: >-
          docker run --rm -v "$RUNNER_TEMP:/scan:rw" aquasec/trivy:0.66.0
          image --input /scan/backend-image.tar --format cyclonedx
          --output /scan/backend-sbom.json --scanners vuln --skip-version-check
      - run: >-
          docker run --rm -v "$RUNNER_TEMP:/scan:rw" aquasec/trivy:0.66.0
          image --input /scan/frontend-image.tar --format cyclonedx
          --output /scan/frontend-sbom.json --scanners vuln --skip-version-check

  production-smoke:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - run: docker build -f backend/Dockerfile -t quantlab-backend .
      - run: docker build -f frontend/Dockerfile -t quantlab-frontend .
      - run: ./scripts/production-smoke.sh
