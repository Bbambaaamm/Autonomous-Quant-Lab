name: Agent verified gate

on:
  workflow_call:
    inputs:
      pr_number: {required: true, type: number}
      head_sha: {required: true, type: string}
      spec_hash: {required: true, type: string}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    outputs:
      pass: ${{ steps.gate.outputs.pass }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: '${{ github.event.repository.default_branch }}', persist-credentials: false, fetch-depth: 1}
      - id: gate
        name: Revalidate exact-SHA evidence and publish trusted gate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR: ${{ inputs.pr_number }}
          HEAD: ${{ inputs.head_sha }}
          SPEC: ${{ inputs.spec_hash }}
        with:
          script: |
            const p=require('./.github/scripts/agent-pipeline.cjs'),a=require('./.github/scripts/agent-autonomy.cjs'),c=require('./.github/agent-pipeline.json');
            const prNumber=Number(process.env.PR),headSha=process.env.HEAD,spec=process.env.SPEC,repo=`${context.repo.owner}/${context.repo.repo}`;
            if(!Number.isSafeInteger(prNumber)||prNumber<1||!/^[0-9a-f]{40}$/.test(headSha)||!/^[0-9a-f]{64}$/.test(spec)) return core.setFailed('INVALID_GATE_BINDING');
            const evaluate=async()=>{
              const {data:pr}=await github.rest.pulls.get({...context.repo,pull_number:prNumber});
              if(pr.head.sha!==headSha) return {ok:false,reason:'HEAD_SHA_MISMATCH',currentHead:pr.head.sha};
              const issueNumber=p.parseAgentIssue(pr.body);
              if(!issueNumber) return {ok:false,reason:'LINKAGE_INVALID',currentHead:pr.head.sha};
              const {data:issue}=await github.rest.issues.get({...context.repo,issue_number:issueNumber});
              const prComments=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:prNumber,per_page:100});
              const issueComments=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:issueNumber,per_page:100});
              const auth=a.authorizationDecision({comments:issueComments,repo,issueNumber,title:issue.title,body:issue.body||'',labels:issue.labels,state:issue.state});
              const linkage=p.fullLinkageDecision({prBody:pr.body,prComments,issueComments,...context.repo,issueNumber,prNumber});
              const {data:main}=await github.rest.repos.getBranch({...context.repo,branch:context.payload.repository.default_branch});
              const comparison=await github.rest.repos.compareCommits({...context.repo,base:main.commit.sha,head:headSha});
              const runs=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{...context.repo,event:'pull_request',head_sha:headSha,status:'completed',per_page:100});
              const ciRun=p.newestAuthoritativeCiRun(runs,{workflowName:'CI',headSha,prNumber});
              const jobs=ciRun?await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:ciRun.id,filter:'all',per_page:100}):null;
              const verifiedLifecycle=a.lifecyclePairDecision(pr.labels,issue.labels,'agent:verified').ok;
              const decision=a.gateDecision({
                authorizationCurrent:auth.ok&&auth.specHash===spec,
                issueOpen:issue.state==='open',
                issueIsImplementation:p.isImplementation(issue.labels),
                linkageValid:linkage.ok,
                open:pr.state==='open',
                correctBase:pr.base.ref===context.payload.repository.default_branch,
                draft:pr.draft,
                exactHead:pr.head.sha===headSha,
                verifiedLifecycle,
                needsHuman:[...a.labelNames(pr.labels),...a.labelNames(issue.labels)].includes('agent:needs-human'),
                currentMain:comparison.data.behind_by===0,
                requiredCiSuccessful:!!ciRun&&ciRun.conclusion==='success'&&p.successfulRequiredJobs(jobs,c.requiredCiJobs,headSha),
                independentReviewPass:p.independentReviewSatisfied(prComments,headSha),
                verificationEvidence:a.exactVerificationEvidence(prComments,{repo,issueNumber,prNumber,headSha,specHash:spec}),
              });
              return {...decision,pr,issue,issueNumber,ciRun,currentHead:pr.head.sha};
            };
            let result=await evaluate();
            if(!result.ok){
              if(result.currentHead===headSha){
                await github.rest.repos.createCommitStatus({...context.repo,sha:headSha,state:'failure',context:a.GATE_CONTEXT,description:String(result.reason).slice(0,140)});
              }
              return core.setFailed(`GATE_REJECTED:${result.reason}`);
            }
            result=await evaluate();
            if(!result.ok) return core.setFailed(`GATE_TOCTOU_REJECTED:${result.reason}`);
            await github.rest.repos.createCommitStatus({...context.repo,sha:headSha,state:'success',context:a.GATE_CONTEXT,description:'Exact authorization + CI + Codex review verified'});
            core.setOutput('pass','true');

  merge:
    needs: gate
    if: needs.gate.outputs.pass == 'true'
    uses: ./.github/workflows/agent-auto-merge.yml
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    with:
      pr_number: ${{ inputs.pr_number }}
      head_sha: ${{ inputs.head_sha }}
      spec_hash: ${{ inputs.spec_hash }}
