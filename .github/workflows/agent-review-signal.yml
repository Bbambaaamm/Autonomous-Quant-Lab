    types: [submitted]

# Tento nedůvěryhodný PR event pouze vytvoří read-free completion signal. Zápis a
# načtení CI evidence provede až trusted workflow_run verifier z default branch.
permissions: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Review signal pro trusted verifier"
