name: PR67 CI cleanup

on:
  push:
    branches:
      - fix/pre-pilot-review-remediation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pre-pilot-review-remediation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
      - name: Fix regressions and format
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/tests/test_pre_pilot_review_remediation.py')
          text = p.read_text()
          old = '    assert repaired.next_run_at == now + timedelta(minutes=1)\n'
          new = '    assert repaired.next_run_at.replace(tzinfo=UTC) == now + timedelta(minutes=1)\n'
          if text.count(old) != 1:
              raise SystemExit('monitoring timestamp assertion marker mismatch')
          p.write_text(text.replace(old, new, 1))

          p = Path('frontend/tests/security.test.ts')
          text = p.read_text()
          old = '    expect(actions).not.toContain("/automation/runs/${segment(runId)}/retry");\n'
          new = '    expect(actions).not.toContain("mutate(`/automation/runs/${segment(runId)}/retry`");\n'
          if text.count(old) != 1:
              raise SystemExit('frontend retry assertion marker mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
          cd backend
          uv sync --locked --all-groups
          uv run ruff format .
          cd ..
          rm .github/workflows/pr67-format-and-tests-fix.yml
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "PR67 remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix PR67 CI formatting and assertions"
          git push origin HEAD:fix/pre-pilot-review-remediation
