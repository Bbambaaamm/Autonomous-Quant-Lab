name: Agent verification invalidation

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read

jobs:
  invalidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Invaliduj verified stav po změně head SHA
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            // Workflow používá pouze trusted helper z default branch; nikdy nenačítá ani nespouští PR kód.
            const pipeline = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/agent-pipeline.cjs`);
            const mutate = async (number, plan) => {
              if (plan.add.length) {
                await github.rest.issues.addLabels({ ...context.repo, issue_number: number, labels: plan.add });
              }
              for (const label of plan.remove) {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number: number, name: label });
              }
            };
            const pull = context.payload.pull_request;
            const prNumber = pull.number;
            const { data: freshPull } = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber });
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: prNumber, per_page: 100,
            });
            const durableLink = pipeline.durableIssueLinkDecision(comments, { ...context.repo, prNumber });
            let freshIssue = null;
            if (durableLink.ok && durableLink.issueNumber !== null) {
              ({ data: freshIssue } = await github.rest.issues.get({
                ...context.repo, issue_number: durableLink.issueNumber,
              }));
            }
            const decision = pipeline.invalidationLifecycleDecision({
              prLabels: freshPull.labels,
              issueLabels: freshIssue?.labels,
              issueLoaded: freshIssue !== null && !freshIssue.pull_request,
              durableLink,
              markerIssueNumber: pipeline.parseAgentIssue(freshPull.body),
            });
            if (["PRELINK_NO_WRITE", "LINKED_PR_NO_WRITE", "NEEDS_HUMAN_NO_WRITE"].includes(decision.action)) {
              core.notice(`NO_WRITE: ${decision.action}`); return;
            }
            if (decision.action === "ESCALATE_CONFLICT") {
              const prPlan = pipeline.escalationMutationPlan(freshPull.labels);
              const issuePlan = freshIssue ? pipeline.escalationMutationPlan(freshIssue.labels) : null;
              if (!prPlan.ok || (issuePlan && !issuePlan.ok)) {
                return core.setFailed(`${decision.reason}: conflicting stav nelze bezpečně eskalovat`);
              }
              await mutate(prNumber, prPlan);
              if (issuePlan) await mutate(durableLink.issueNumber, issuePlan);
              await github.rest.issues.createComment({ ...context.repo, issue_number: prNumber,
                body: `Verification invalidation selhala zavřeně: ${decision.reason}. Vyžaduje zásah maintaineru.` });
              return;
            }
            const issueNumber = decision.issueNumber;
            const prPlan = pipeline.stateMutationPlan(freshPull.labels, "agent:verified", "agent:pr");
            const issuePlan = pipeline.stateMutationPlan(freshIssue.labels, "agent:verified", "agent:pr");
            if (!prPlan.ok || !issuePlan.ok) return core.setFailed("INVALIDATION_PLAN_CONFLICT");
            await mutate(prNumber, prPlan);
            const { data: writeFreshPull } = await github.rest.pulls.get({
              ...context.repo, pull_number: prNumber,
            });
            const { data: writeFreshIssue } = await github.rest.issues.get({ ...context.repo, issue_number: issueNumber });
            const writeFreshComments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: prNumber, per_page: 100,
            });
            const writeFreshDurableLink = pipeline.durableIssueLinkDecision(writeFreshComments, {
              ...context.repo, prNumber,
            });
            const writeDecision = pipeline.invalidationLifecycleDecision({
              prLabels: writeFreshPull.labels,
              issueLabels: writeFreshIssue.labels,
              issueLoaded: !writeFreshIssue.pull_request,
              durableLink: writeFreshDurableLink,
              markerIssueNumber: pipeline.parseAgentIssue(writeFreshPull.body),
            });
            if (writeFreshDurableLink.issueNumber !== issueNumber ||
                (writeDecision.action !== "INVALIDATE_VERIFIED" && writeDecision.action !== "LINKED_PR_NO_WRITE")) {
              return core.setFailed("ISSUE_CHANGED_DURING_INVALIDATION: PR může být v partial agent:pr stavu");
            }
            const writeIssuePlan = pipeline.stateMutationPlan(writeFreshIssue.labels, "agent:verified", "agent:pr");
            if (!writeIssuePlan.ok) return core.setFailed("ISSUE_CHANGED_DURING_INVALIDATION");
            await mutate(issueNumber, writeIssuePlan);
            const evidence = `Verification invalidated po změně PR head SHA na \`${freshPull.head.sha}\`. Nový SHA vyžaduje nové exact-SHA review evidence a nový CI run.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: prNumber, body: evidence });
            await github.rest.issues.createComment({ ...context.repo, issue_number: issueNumber, body: `PR #${prNumber}: ${evidence}` });
