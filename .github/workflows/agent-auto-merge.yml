name: Agent exact-SHA auto merge

on:
  workflow_call:
    inputs:
      pr_number: {required: true, type: number}
      head_sha: {required: true, type: string}
      spec_hash: {required: true, type: string}

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: '${{ github.event.repository.default_branch }}', persist-credentials: false, fetch-depth: 1}
      - name: Fresh exact-SHA merge controller
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR: ${{ inputs.pr_number }}
          HEAD: ${{ inputs.head_sha }}
          SPEC: ${{ inputs.spec_hash }}
        with:
          script: |
            const p=require('./.github/scripts/agent-pipeline.cjs'),a=require('./.github/scripts/agent-autonomy.cjs'),c=require('./.github/agent-pipeline.json');
            const prNumber=Number(process.env.PR),headSha=process.env.HEAD,spec=process.env.SPEC,repo=`${context.repo.owner}/${context.repo.repo}`;
            if(!Number.isSafeInteger(prNumber)||prNumber<1||!/^[0-9a-f]{40}$/.test(headSha)||!/^[0-9a-f]{64}$/.test(spec)) return core.setFailed('INVALID_MERGE_BINDING');
            const setNeedsHuman=async(issueNumber,reason)=>{
              for(const number of [prNumber,issueNumber]){
                const {data:item}=await github.rest.issues.get({...context.repo,issue_number:number});
                const names=a.labelNames(item.labels),preserved=names.filter(label=>!label.startsWith('agent:'));
                await github.rest.issues.setLabels({...context.repo,issue_number:number,labels:[...preserved,'agent:needs-human']});
              }
              await github.rest.issues.createComment({...context.repo,issue_number:prNumber,body:`Automatic merge stopped fail-closed: ${reason}`});
            };
            const load=async()=>{
              const {data:pr}=await github.rest.pulls.get({...context.repo,pull_number:prNumber});
              const issueNumber=p.parseAgentIssue(pr.body);
              if(!issueNumber) return {ok:false,reason:'LINKAGE_INVALID',pr};
              const {data:issue}=await github.rest.issues.get({...context.repo,issue_number:issueNumber});
              const prComments=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:prNumber,per_page:100});
              const issueComments=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:issueNumber,per_page:100});
              const auth=a.authorizationDecision({comments:issueComments,repo,issueNumber,title:issue.title,body:issue.body||'',labels:issue.labels});
              const linkage=p.fullLinkageDecision({prBody:pr.body,prComments,issueComments,...context.repo,issueNumber,prNumber});
              const {data:main}=await github.rest.repos.getBranch({...context.repo,branch:context.payload.repository.default_branch});
              const comparison=pr.head.sha===headSha ? await github.rest.repos.compareCommits({...context.repo,base:main.commit.sha,head:headSha}) : null;
              return {ok:true,pr,issue,issueNumber,prComments,issueComments,auth,linkage,main,comparison};
            };
            let state=await load();
            if(!state.ok) return core.setFailed(state.reason);
            if(state.pr.head.sha!==headSha) return core.notice('NO_WRITE: head already changed; new exact-SHA cycle is authoritative');
            if(!state.auth.ok||state.auth.specHash!==spec||!state.linkage.ok||!p.isImplementation(state.issue.labels)) return core.setFailed('MERGE_AUTHORIZATION_OR_LINKAGE_REJECTED');
            if(state.comparison.data.behind_by>0){
              try {
                await github.rest.pulls.updateBranch({...context.repo,pull_number:prNumber,expected_head_sha:headSha});
                return core.notice('Main moved: branch reconciled automatically; new SHA requires fresh CI and review');
              } catch(error) {
                if(error.status===409||error.status===422){await setNeedsHuman(state.issueNumber,'RECONCILIATION_CONFLICT');return;}
                throw error;
              }
            }
            const runs=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{...context.repo,event:'pull_request',head_sha:headSha,status:'completed',per_page:100});
            const candidates=p.authoritativeCiRunCandidates(runs,{workflowName:'CI',headSha,prNumber});
            let ciRun=null,jobs=null;
            for(const candidate of candidates){
              const candidateJobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:candidate.id,filter:'all',per_page:100});
              if(p.successfulRequiredJobs(candidateJobs,c.requiredCiJobs,headSha)){ciRun=candidate;jobs=candidateJobs;break;}
            }
            const statuses=(await github.rest.repos.listCommitStatusesForRef({...context.repo,ref:headSha,per_page:100})).data;
            const gate=statuses.find(status=>status.context===a.GATE_CONTEXT);
            const mergeDecision=a.mergeDecision({
              authorizationCurrent:state.auth.ok&&state.auth.specHash===spec,
              issueIsImplementation:p.isImplementation(state.issue.labels),
              linkageValid:state.linkage.ok,
              open:state.pr.state==='open',
              correctBase:state.pr.base.ref===context.payload.repository.default_branch,
              draft:state.pr.draft,
              exactHead:state.pr.head.sha===headSha,
              verifiedLifecycle:a.lifecyclePairDecision(state.pr.labels,state.issue.labels,'agent:verified').ok,
              needsHuman:[...a.labelNames(state.pr.labels),...a.labelNames(state.issue.labels)].includes('agent:needs-human'),
              currentMain:state.comparison.data.behind_by===0,
              requiredCiSuccessful:!!ciRun&&p.successfulRequiredJobs(jobs,c.requiredCiJobs,headSha),
              independentReviewPass:p.independentReviewSatisfied(state.prComments,headSha),
              verificationEvidence:a.exactVerificationEvidence(state.prComments,{repo,issueNumber:state.issueNumber,prNumber,headSha,specHash:spec}),
              gateSuccess:gate?.state==='success'&&gate?.creator?.login==='github-actions[bot]',
              expectedHeadUnchanged:true,
            });
            if(!mergeDecision.ok) return core.setFailed(`MERGE_REJECTED:${mergeDecision.reason}`);

            state=await load();
            if(!state.ok||state.pr.state!=='open'||state.pr.head.sha!==headSha||!state.auth.ok||state.auth.specHash!==spec||!state.linkage.ok||state.comparison.data.behind_by!==0||!a.lifecyclePairDecision(state.pr.labels,state.issue.labels,'agent:verified').ok) return core.setFailed('FINAL_TOCTOU_REJECTED');
            const freshStatuses=(await github.rest.repos.listCommitStatusesForRef({...context.repo,ref:headSha,per_page:100})).data;
            const freshGate=freshStatuses.find(status=>status.context===a.GATE_CONTEXT);
            if(freshGate?.state!=='success'||freshGate?.creator?.login!=='github-actions[bot]') return core.setFailed('FINAL_GATE_REJECTED');
            const {data:merged}=await github.rest.pulls.merge({...context.repo,pull_number:prNumber,sha:headSha,merge_method:'merge'});
            if(!merged.merged||!/^[0-9a-f]{40}$/.test(merged.sha||'')) return core.setFailed(`MERGE_API_REJECTED:${merged.message||'unknown'}`);
            const marker=a.mergeMarker({repo,issueNumber:state.issueNumber,prNumber,headSha,specHash:spec,mergeSha:merged.sha});
            await github.rest.issues.createComment({...context.repo,issue_number:state.issueNumber,body:`PR #${prNumber} automatically merged after fresh exact-SHA verification.\n\nVerified head: \`${headSha}\`\nMerge commit: \`${merged.sha}\`\n\n${marker}`});
