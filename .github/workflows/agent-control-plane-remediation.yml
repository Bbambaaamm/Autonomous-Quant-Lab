      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: 'control-plane-evidence-${{ github.run_id }}', path: '${{ runner.temp }}/acceptance-evidence.json', if-no-files-found: error, retention-days: 7}

  independent-review:
    needs: [prepare, collect-acceptance-evidence]
    if: needs.prepare.outputs.eligible == 'true' && needs.collect-acceptance-evidence.result == 'success'
    runs-on: ubuntu-latest
    permissions: {actions: read, contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: '${{ needs.prepare.outputs.head_sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: 'control-plane-scope-${{ github.run_id }}', path: '${{ runner.temp }}/control-plane-input'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
