name: Agent control-plane remediation

on:
  workflow_run:
    workflows: [Agent control-plane remediation request]
    types: [completed]

permissions: {contents: read}

concurrency:
  group: agent-control-plane-remediation-${{ github.event.workflow_run.display_title }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.prepare.outputs.eligible }}
      issue_number: ${{ steps.prepare.outputs.issue_number }}
      pr_number: ${{ steps.prepare.outputs.pr_number }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      spec_hash: ${{ steps.prepare.outputs.spec_hash }}
      entry_state: ${{ steps.prepare.outputs.entry_state }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: '${{ github.event.repository.default_branch }}', persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: control-plane-request-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/request
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - id: prepare
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs=require('fs'),p=require('./.github/scripts/agent-pipeline.cjs'),a=require('./.github/scripts/agent-autonomy.cjs'),c=require('./.github/agent-pipeline.json');
            const request=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/request/request.json`)),run=context.payload.workflow_run,repo=`${context.repo.owner}/${context.repo.repo}`,def=context.payload.repository.default_branch;
            const issueNumber=Number(request.issueNumber),prNumber=Number(request.prNumber),headSha=request.headSha;
            if(run.conclusion!=='success'||run.event!=='workflow_dispatch'||run.head_branch!==def||run.head_repository?.full_name!==repo||run.path!=='.github/workflows/agent-control-plane-remediation-request.yml'||Number(request.requestRunId)!==Number(run.id)||request.actor!==run.actor?.login) return core.setFailed('UNTRUSTED_REQUEST_RUN');
            if(!Number.isSafeInteger(issueNumber)||issueNumber<1||!Number.isSafeInteger(prNumber)||prNumber<1||!/^[0-9a-f]{40}$/.test(headSha)||!/^[0-9a-f]{64}$/.test(request.specHash||'')||!['agent:needs-human','agent:pr'].includes(request.entryState)) return core.setFailed('INVALID_REQUEST_ARTIFACT');
            const {data:permission}=await github.rest.repos.getCollaboratorPermissionLevel({...context.repo,username:request.actor});
            if(!['admin','maintain','write'].includes(permission.permission)) return core.setFailed('MAINTAINER_PERMISSION_REQUIRED');
            const allowed=path=>typeof path==='string'&&(/^\.github\/workflows\/agent-[^/]+\.yml$/.test(path)||/^\.github\/scripts\/agent-[^/]+\.cjs$/.test(path)||path==='.github/agent-pipeline.json'||path==='docs/autonomous-development-pipeline.md'||path==='docs/adr/0003-autonomous-development-pipeline-v2.md'||path==='docs/adr/0006-conditional-autonomous-merge.md'||path==='docs/adr/0007-control-plane-remediation.md');
            const fileAllowed=file=>allowed(file.filename)&&(file.status!=='renamed'||allowed(file.previous_filename));
            const newestCi=(runs)=>runs.filter(x=>x.name==='CI'&&x.event==='pull_request'&&x.head_sha===headSha&&x.pull_requests?.length===1&&x.pull_requests[0].number===prNumber).sort((x,y)=>y.id-x.id)[0]||null;
            const {data:pr}=await github.rest.pulls.get({...context.repo,pull_number:prNumber}),{data:issue}=await github.rest.issues.get({...context.repo,issue_number:issueNumber});
            const issueComments=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:issueNumber,per_page:100}),prComments=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:prNumber,per_page:100});
            const auth=a.authorizationDecision({comments:issueComments,repo,issueNumber,title:issue.title,body:issue.body||'',labels:issue.labels,state:issue.state}),issueLink=p.durablePrLinkDecision(issueComments,{...context.repo,issueNumber}),prLink=p.durableIssueLinkDecision(prComments,{...context.repo,prNumber});
            const recoveryOk=p.stateMutationPlan(issue.labels,'agent:needs-human','agent:pr').ok&&p.stateMutationPlan(pr.labels,'agent:needs-human','agent:pr').ok;
            const entryOk=request.entryState==='agent:needs-human'?recoveryOk:p.lifecycleAtAgentPr(pr.labels,issue.labels).ok;
            if(pr.state!=='open'||pr.draft||pr.base.ref!==def||pr.head.sha!==headSha||p.parseAgentIssue(pr.body)!==issueNumber||issue.state!=='open'||!p.isImplementation(issue.labels)||!auth.ok||auth.specHash!==request.specHash||!entryOk||!issueLink.ok||!prLink.ok||(issueLink.prNumber!==null&&issueLink.prNumber!==prNumber)||(prLink.issueNumber!==null&&prLink.issueNumber!==issueNumber)) return core.setFailed('MAINTENANCE_BINDING_CHANGED');
            const changed=await github.paginate(github.rest.pulls.listFiles,{...context.repo,pull_number:prNumber,per_page:100});
            const completeFileList=Number.isSafeInteger(pr.changed_files)&&pr.changed_files>0&&pr.changed_files<=3000&&changed.length===pr.changed_files;
            if(!completeFileList||changed.some(file=>!fileAllowed(file))) return core.setFailed('CONTROL_PLANE_SCOPE_VIOLATION');
            const {data:main}=await github.rest.repos.getBranch({...context.repo,branch:def}),comparison=await github.rest.repos.compareCommits({...context.repo,base:main.commit.sha,head:headSha});
            if(comparison.data.behind_by!==0) return core.setFailed('PR_BEHIND_MAIN');
            const runs=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{...context.repo,event:'pull_request',head_sha:headSha,per_page:100}),ciRun=newestCi(runs),jobs=ciRun?.status==='completed'?await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:ciRun.id,filter:'all',per_page:100}):null,freshCi=ciRun?(await github.rest.actions.getWorkflowRun({...context.repo,run_id:ciRun.id})).data:null,finalRuns=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{...context.repo,event:'pull_request',head_sha:headSha,per_page:100}),finalCi=newestCi(finalRuns);
            if(!ciRun||!freshCi||!finalCi||ciRun.id!==freshCi.id||ciRun.id!==finalCi.id||ciRun.run_attempt!==freshCi.run_attempt||ciRun.run_attempt!==finalCi.run_attempt||freshCi.status!=='completed'||freshCi.conclusion!=='success'||!p.successfulRequiredJobs(jobs,c.requiredCiJobs,headSha)) return core.setFailed('NEWEST_REQUIRED_CI_NOT_GREEN');
            const governance={};
            for(const file of ['AGENTS.md','.github/agent-pipeline.json','docs/autonomous-development-pipeline.md','docs/adr/0003-autonomous-development-pipeline-v2.md','docs/adr/0006-conditional-autonomous-merge.md']) governance[file]=fs.readFileSync(file,'utf8');
            const scope={...request,baseSha:pr.base.sha,title:p.redactDiagnostic(issue.title,256),body:p.redactDiagnostic(issue.body||'',16384),changedFiles:changed.map(x=>({filename:x.filename,status:x.status,previous_filename:x.previous_filename||null}))};
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/trusted-governance.json`,JSON.stringify(governance)); fs.writeFileSync(`${process.env.RUNNER_TEMP}/maintenance-scope.json`,JSON.stringify(scope)); fs.copyFileSync(`${process.env.RUNNER_TEMP}/request/request.json`,`${process.env.RUNNER_TEMP}/request.json`);
            for(const [k,v] of Object.entries({eligible:'true',issue_number:issueNumber,pr_number:prNumber,head_sha:headSha,base_sha:pr.base.sha,spec_hash:auth.specHash,entry_state:request.entryState})) core.setOutput(k,String(v));
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.prepare.outputs.eligible == 'true'
        with: {name: 'control-plane-scope-${{ github.run_id }}', path: '${{ runner.temp }}/*.json', if-no-files-found: error, retention-days: 1}

  collect-acceptance-evidence:
    needs: prepare
    outputs:
      evidence_digest: ${{ steps.evidence.outputs.digest }}
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions: {actions: read, contents: read, issues: read, pull-requests: read}
    steps:
      # Deliberately no checkout: this secret-bearing job never materializes or executes candidate code.
      - id: evidence
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env: {ISSUE: '${{ needs.prepare.outputs.issue_number }}', PR: '${{ needs.prepare.outputs.pr_number }}', HEAD: '${{ needs.prepare.outputs.head_sha }}', BASE: '${{ needs.prepare.outputs.base_sha }}'}
        with:
          github-token: ${{ secrets.AGENT_PUBLISH_TOKEN }}
          script: |
            const fs=require('fs'),issueNumber=Number(process.env.ISSUE),prNumber=Number(process.env.PR),headSha=process.env.HEAD,baseSha=process.env.BASE;
            const required=['agent-pipeline','quality','unit-research','api','integration-postgres','frontend','security','container-build','production-smoke'];
            const requiredContexts=[...required,'agent-verified-gate'].sort(),actionsIntegrationId=15368;
            const {data:repository}=await github.rest.repos.get(context.repo),def=repository.default_branch;
            const {data:pr}=await github.rest.pulls.get({...context.repo,pull_number:prNumber}),{data:issue}=await github.rest.issues.get({...context.repo,issue_number:issueNumber});
            if(repository.full_name!==`${context.repo.owner}/${context.repo.repo}`||pr.state!=='open'||pr.draft||pr.head.sha!==headSha||pr.base.ref!==def||pr.base.sha!==baseSha||issue.state!=='open') return core.setFailed('EVIDENCE_BINDING_CHANGED');
            const runs=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{...context.repo,event:'pull_request',head_sha:headSha,per_page:100});
            const matches=runs.filter(x=>x.name==='CI'&&x.event==='pull_request'&&x.head_sha===headSha&&x.pull_requests?.length===1&&x.pull_requests[0].number===prNumber).sort((x,y)=>y.id-x.id);
            if(!matches.length)return core.setFailed('EVIDENCE_CI_MISSING'); const run=matches[0];if(run.status!=='completed'||run.conclusion!=='success')return core.setFailed('EVIDENCE_NEWEST_CI_NOT_GREEN');
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:run.id,filter:'all',per_page:100});
            const latest=new Map();for(const job of jobs){if(!required.includes(job.name))continue;const old=latest.get(job.name);if(!old||job.run_attempt>=old.run_attempt)latest.set(job.name,job);}const selected=[...latest.values()];
            if(selected.length!==required.length||selected.some(x=>x.status!=='completed'||x.conclusion!=='success')) return core.setFailed('EVIDENCE_REQUIRED_JOBS_INVALID');
            const summaries=await github.paginate('GET /repos/{owner}/{repo}/rulesets',{...context.repo,per_page:100});
            const candidates=summaries.filter(x=>x.name==='Protect main'&&x.target==='branch'&&x.enforcement==='active');
            if(candidates.length!==1)return core.setFailed('EVIDENCE_RULESET_AMBIGUOUS');
            const {data:ruleset}=await github.request('GET /repos/{owner}/{repo}/rulesets/{ruleset_id}',{...context.repo,ruleset_id:candidates[0].id});
            const typed=t=>ruleset.rules?.filter(x=>x.type===t)||[],checks=typed('required_status_checks'),configured=(checks[0]?.parameters?.required_status_checks||[]).map(x=>x.context).sort(),gate=(checks[0]?.parameters?.required_status_checks||[]).find(x=>x.context==='agent-verified-gate');
            const valid=ruleset.name==='Protect main'&&ruleset.target==='branch'&&ruleset.enforcement==='active'&&Array.isArray(ruleset.bypass_actors)&&ruleset.bypass_actors.length===0&&ruleset.conditions?.ref_name?.include?.length===1&&ruleset.conditions.ref_name.include[0]===`refs/heads/${def}`&&(ruleset.conditions.ref_name.exclude||[]).length===0&&typed('deletion').length===1&&typed('non_fast_forward').length===1&&typed('pull_request').length===1&&checks.length===1&&checks[0].parameters?.strict_required_status_checks_policy===true&&JSON.stringify(configured)===JSON.stringify(requiredContexts)&&gate?.integration_id===actionsIntegrationId;
            if(!valid)return core.setFailed('EVIDENCE_RULESET_INVALID');
            const {data:freshRun}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:run.id}),finalRuns=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{...context.repo,event:'pull_request',head_sha:headSha,per_page:100}),finalRun=finalRuns.filter(x=>x.name==='CI'&&x.event==='pull_request'&&x.head_sha===headSha&&x.pull_requests?.length===1&&x.pull_requests[0].number===prNumber).sort((x,y)=>y.id-x.id)[0];
            const {data:freshRepository}=await github.rest.repos.get(context.repo),{data:freshMain}=await github.rest.repos.getBranch({...context.repo,branch:def}),{data:freshPr}=await github.rest.pulls.get({...context.repo,pull_number:prNumber}),{data:freshIssue}=await github.rest.issues.get({...context.repo,issue_number:issueNumber}),{data:freshRuleset}=await github.request('GET /repos/{owner}/{repo}/rulesets/{ruleset_id}',{...context.repo,ruleset_id:ruleset.id});
            if(!finalRun||freshRun.id!==run.id||finalRun.id!==run.id||freshRun.run_attempt!==run.run_attempt||finalRun.run_attempt!==run.run_attempt||freshRun.status!=='completed'||freshRun.conclusion!=='success'||freshRepository.full_name!==repository.full_name||freshRepository.default_branch!==def||freshMain.commit.sha!==baseSha||freshPr.head.sha!==headSha||freshPr.base.sha!==baseSha||freshPr.state!=='open'||freshPr.draft||freshIssue.state!=='open'||freshRuleset.enforcement!=='active'||freshRuleset.updated_at!==ruleset.updated_at||JSON.stringify(freshRuleset)!==JSON.stringify(ruleset))return core.setFailed('EVIDENCE_FINAL_SNAPSHOT_CHANGED');
            const evidence={schema:'control-plane-acceptance-evidence:v1',workflowRunId:Number(context.runId),collectedAt:new Date().toISOString(),repository:repository.full_name,defaultBranch:def,issue:{number:issue.number,state:issue.state},pullRequest:{number:pr.number,state:pr.state,draft:pr.draft,headSha:pr.head.sha,baseRef:pr.base.ref,baseSha:pr.base.sha},ci:{runId:run.id,runAttempt:run.run_attempt,headSha:run.head_sha,jobs:selected.map(x=>({name:x.name,id:x.id,status:x.status,conclusion:x.conclusion,runAttempt:x.run_attempt})).sort((a,b)=>a.name.localeCompare(b.name))},ruleset:{id:ruleset.id,name:ruleset.name,target:ruleset.target,enforcement:ruleset.enforcement,conditions:ruleset.conditions,rules:ruleset.rules,bypassActors:ruleset.bypass_actors}};
