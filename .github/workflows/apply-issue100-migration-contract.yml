name: Apply Issue 100 bootstrap migration contract

on:
  push:
    branches:
      - fix/issue-100-bootstrap-migration-contract
    paths:
      - .github/workflows/apply-issue100-migration-contract.yml

permissions:
  contents: read

jobs:
  apply:
    if: github.actor == 'Bbambaaamm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/issue-100-bootstrap-migration-contract
          fetch-depth: 0
          persist-credentials: false
      - name: Apply migration contract clarification without write credential
        run: python .github/scripts/apply-issue100-migration-contract.py
      - name: Validate workflow before publication
        run: |
          set -euo pipefail
          git diff --check
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/bootstrap-issue-100-publisher.yml", aliases: true)'
          grep -F 'reference context only' .github/workflows/bootstrap-issue-100-publisher.yml
          grep -F 'MUST NOT be modified, replaced, generalized, or treated as a reason to return BLOCK' .github/workflows/bootstrap-issue-100-publisher.yml
      - name: Trusted publication and self-cleanup
        env:
          GH_TOKEN: ${{ secrets.AGENT_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          git add .github/workflows/bootstrap-issue-100-publisher.yml
          git rm .github/scripts/apply-issue100-migration-contract.py .github/workflows/apply-issue100-migration-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Clarify Issue 100 bootstrap migration contract'
          gh auth setup-git
          git push origin HEAD:fix/issue-100-bootstrap-migration-contract
