name: Agent authorize implementation

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Concrete type:implementation Issue to authorize
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agent-authorize-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Record exact Issue authorization and start Builder
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const p = require('./.github/scripts/agent-pipeline.cjs');
            const a = require('./.github/scripts/agent-autonomy.cjs');
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!Number.isSafeInteger(issueNumber) || issueNumber < 1) return core.setFailed('INVALID_ISSUE_NUMBER');

            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.actor,
            });
            if (!['admin', 'maintain', 'write'].includes(permission.permission)) {
              return core.setFailed('ACTOR_NOT_AUTHORIZED');
            }
            const defaultBranch = context.payload.repository.default_branch;
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: defaultBranch });
            if (branch.commit.sha !== context.sha || context.ref !== `refs/heads/${defaultBranch}`) {
              return core.setFailed('STALE_OR_NON_DEFAULT_WORKFLOW_REVISION');
            }

            const loadIssue = async () => (await github.rest.issues.get({ ...context.repo, issue_number: issueNumber })).data;
            let issue = await loadIssue();
            if (issue.pull_request || issue.state !== 'open' || !p.isImplementation(issue.labels)) {
              return core.setFailed('ISSUE_NOT_CONCRETE_IMPLEMENTATION');
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: issueNumber, per_page: 100,
            });
            const specHash = a.issueSpecHash({ title: issue.title, body: issue.body || '', labels: issue.labels });
            const existing = a.parseAuthorization(comments, {
              repo: `${context.repo.owner}/${context.repo.repo}`, issueNumber,
            });
            const agentStates = a.labelNames(issue.labels).filter(label => label.startsWith('agent:'));
            const state = agentStates.length === 0 ? 'none' : agentStates.length === 1 ? agentStates[0] : 'ambiguous';
            const idempotentRunning = state === 'agent:running' && existing.ok && existing.specHash === specHash;
            if (!['none', 'agent:needs-human'].includes(state) && !idempotentRunning) {
              return core.setFailed(`ISSUE_NOT_AUTHORIZABLE_FROM_${state}`);
            }
            if (!existing.ok && existing.reason !== 'AUTHORIZATION_MISSING') {
              return core.setFailed(existing.reason);
            }

            if (state === 'agent:needs-human') {
              const link = p.durablePrLinkDecision(comments, { ...context.repo, issueNumber });
              if (!link.ok) return core.setFailed(link.reason);
              if (link.prNumber !== null) {
                const { data: oldPr } = await github.rest.pulls.get({ ...context.repo, pull_number: link.prNumber });
                const oldPrComments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: link.prNumber, per_page: 100 });
                const linkage = p.fullLinkageDecision({ prBody: oldPr.body, prComments: oldPrComments, issueComments: comments, ...context.repo, issueNumber, prNumber: link.prNumber });
                if (!linkage.ok) return core.setFailed(`OLD_PR_${linkage.reason}`);
                if (oldPr.state === 'open') await github.rest.pulls.update({ ...context.repo, pull_number: link.prNumber, state: 'closed' });
                const retired = `<!-- agent-link-retired:v1 repo=${context.repo.owner}/${context.repo.repo} issue=${issueNumber} pr=${link.prNumber} -->`;
                if (!comments.some(comment => comment.user?.login === 'github-actions[bot]' && (comment.body || '').split('\n').includes(retired))) await github.rest.issues.createComment({...context.repo,issue_number:issueNumber,body:`Retired prior autonomous PR #${link.prNumber} before reauthorization.\n\n${retired}`});
                if (!oldPrComments.some(comment => comment.user?.login === 'github-actions[bot]' && (comment.body || '').split('\n').includes(retired))) await github.rest.issues.createComment({...context.repo,issue_number:link.prNumber,body:`Retired by a fresh explicit authorization cycle for Issue #${issueNumber}.\n\n${retired}`});
                const oldNames=a.labelNames(oldPr.labels),oldPreserved=oldNames.filter(label=>!label.startsWith('agent:')); await github.rest.issues.setLabels({...context.repo,issue_number:link.prNumber,labels:[...oldPreserved,'agent:needs-human']});
                const refreshedComments=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:issueNumber,per_page:100}); const retiredDecision=p.durablePrLinkDecision(refreshedComments,{...context.repo,issueNumber}); if(!retiredDecision.ok||retiredDecision.prNumber!==null) return core.setFailed('OLD_PR_RETIREMENT_POSTCONDITION_FAILED');
              }
            }

            issue = await loadIssue();
            const freshHash = a.issueSpecHash({ title: issue.title, body: issue.body || '', labels: issue.labels });
            if (freshHash !== specHash || issue.state !== 'open' || !p.isImplementation(issue.labels)) {
              return core.setFailed('ISSUE_CHANGED_BEFORE_AUTHORIZATION_WRITE');
            }
            const marker = a.authorizationMarker({
              repo: `${context.repo.owner}/${context.repo.repo}`,
              issueNumber,
              specHash,
              actor: context.actor,
              runId: context.runId,
            });
            const body = [
              'Conditional autonomous merge authorization recorded for this exact Issue specification.',
              `Approving actor: @${context.actor}`,
              `Specification SHA-256: \`${specHash}\``,
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              marker,
            ].join('\n');
            if (existing.ok) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.commentId, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issueNumber, body });
            }

            const preserved = a.labelNames(issue.labels).filter(label => !label.startsWith('agent:'));
            await github.rest.issues.setLabels({
              ...context.repo, issue_number: issueNumber, labels: [...preserved, 'agent:running'],
            });
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issueNumber,
              body: `Autonomous lifecycle advanced through \`agent:ready\` to \`agent:running\` under authorization \`${specHash}\`.`,
            });

            const post = await loadIssue();
            const postComments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: issueNumber, per_page: 100,
            });
            const auth = a.authorizationDecision({
              comments: postComments,
              repo: `${context.repo.owner}/${context.repo.repo}`,
              issueNumber,
              title: post.title,
              body: post.body || '',
              labels: post.labels,
              state: post.state,
            });
            if (!auth.ok || !a.exactAgentState(post.labels, 'agent:running')) {
              return core.setFailed('AUTHORIZATION_POSTCONDITION_FAILED');
            }
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'agent-builder.yml',
              ref: defaultBranch,
              inputs: { issue_number: String(issueNumber), spec_hash: specHash },
            });
