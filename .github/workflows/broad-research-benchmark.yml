name: Broad research benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.3"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked --all-groups
      - name: Run 500k-bar acceptance benchmark
        env:
          PYTHONPATH: src
        run: >-
          /usr/bin/time -v
          uv run python benchmarks/broad_research.py
          --instruments 2000
          --sessions 250
          --max-rss-mib 1024
          --max-seconds 180
          --output broad-research-benchmark.json
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: broad-research-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/broad-research-benchmark.json
          if-no-files-found: warn
          retention-days: 14
