name: Apply pre-pilot remediation

on:
  push:
    branches: [fix/pre-pilot-review-remediation]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/pre-pilot-review-remediation
      - name: Apply reviewed runtime remediation
        run: python scripts/apply-pre-pilot-remediation.py
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement pre-pilot runtime remediation"
          git push origin HEAD:fix/pre-pilot-review-remediation
