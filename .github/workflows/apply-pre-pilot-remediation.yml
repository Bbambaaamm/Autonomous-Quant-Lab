name: Apply pre-pilot remediation

on:
  push:
    branches: [fix/pre-pilot-review-remediation]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/pre-pilot-review-remediation
      - name: Keep one-shot commit outside workflow files
        shell: python
        run: |
          from pathlib import Path
          path = Path("scripts/apply-pre-pilot-remediation.py")
          text = path.read_text()
          ci_block = '''replace_once(
              ".github/workflows/ci.yml",
              "          tests/test_phase7.py\\n",
              "          tests/test_phase7.py\\n          tests/test_pre_pilot_review_remediation.py\\n",
          )

          '''
          if ci_block not in text:
              raise SystemExit("Patcher CI block not found")
          text = text.replace(ci_block, "")
          text = text.replace(
              'Path(".github/workflows/apply-pre-pilot-remediation.yml").unlink()',
              '# workflow is removed after the runtime patch is pushed',
          )
          path.write_text(text)
      - name: Apply reviewed runtime remediation
        run: python scripts/apply-pre-pilot-remediation.py
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement pre-pilot runtime remediation"
          git push origin HEAD:fix/pre-pilot-review-remediation
